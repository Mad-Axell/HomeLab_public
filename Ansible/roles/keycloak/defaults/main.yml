---
# Keycloak server configuration
# Конфигурация сервера Keycloak

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
keycloak_debug_mode: false

# Java runtime
# Java-окружение

# String. Debian package providing the Java runtime. Keycloak 26 requires Java 17 or
# newer; on Debian 13 default-jre-headless resolves to OpenJDK 21. Pin a concrete
# package such as openjdk-21-jre-headless when the runtime version must not drift.
# Строка. Пакет Debian с Java-окружением. Keycloak 26 требует Java 17 или новее;
# в Debian 13 default-jre-headless разрешается в OpenJDK 21. Зафиксируйте конкретный
# пакет вроде openjdk-21-jre-headless, когда версия окружения не должна смещаться.
keycloak_java_package: "default-jre-headless"

# Release
# Выпуск

# String. Upstream Keycloak version to install.
# Строка. Устанавливаемая версия апстримного Keycloak.
keycloak_version: "26.8.2"

# String. URL of the release tarball.
# Строка. URL архива выпуска.
keycloak_download_url: >-
  https://github.com/keycloak/keycloak/releases/download/{{ keycloak_version }}/keycloak-{{ keycloak_version }}.tar.gz

# String or null. Optional checksum in get_url format, for example
# "sha256:<hex>"; null skips verification.
# Строка или null. Необязательная контрольная сумма в формате get_url, например
# "sha256:<hex>"; null отключает проверку.
keycloak_download_checksum: null

# String. Where the tarball is stored on the target host.
# Строка. Куда архив сохраняется на целевом хосте.
keycloak_archive_path: "/tmp/keycloak-{{ keycloak_version }}.tar.gz"

# String. Directory the tarball is unpacked into. Internal, derived from
# keycloak_version; each release lives beside the others and is never overwritten.
# Строка. Каталог, в который распаковывается архив. Внутренний, выводится из
# keycloak_version; каждый выпуск лежит рядом с остальными и не перезаписывается.
keycloak_release_dir: "/opt/keycloak-{{ keycloak_version }}"

# String. Symlink pointing at the unpacked release; the configuration, the systemd
# unit and the service account all reference this stable path.
# Строка. Симлинк на распакованный выпуск; конфигурация, systemd-юнит и учётная
# запись сервиса ссылаются на этот стабильный путь.
keycloak_install_root: "/opt/keycloak"

# System account
# Системная учётная запись

# String. System user the service runs as.
# Строка. Системный пользователь, от имени которого работает сервис.
keycloak_system_user: "keycloak"

# String. Primary group of the service account.
# Строка. Основная группа учётной записи сервиса.
keycloak_system_group: "keycloak"

# Database (external PostgreSQL)
# База данных (внешний PostgreSQL)

# String or null. Hostname or address of the PostgreSQL server. Required; there is
# no safe default.
# Строка или null. Имя или адрес сервера PostgreSQL. Обязательно; безопасного
# умолчания нет.
keycloak_db_host: null

# Integer. PostgreSQL port.
# Целое число. Порт PostgreSQL.
keycloak_db_port: 5432

# String. Database Keycloak owns; created by this role when
# keycloak_manage_database is true.
# Строка. База, принадлежащая Keycloak; создаётся этой ролью, когда
# keycloak_manage_database равен true.
keycloak_db_name: "keycloak"

# String. Login Keycloak connects as.
# Строка. Логин, под которым подключается Keycloak.
keycloak_db_user: "keycloak"

# String or null. Name of the variable holding the database password, taken from
# VARS/secrets.yml; required. The password is referenced by name so its value
# stays out of host_vars and lands only in the environment file.
# Строка или null. Имя переменной с паролем к базе из VARS/secrets.yml;
# обязательно. Пароль указывается по имени, чтобы его значение не попадало в
# host_vars и попадало только в файл окружения.
keycloak_db_password_var: null

# Boolean. Create the database and its role on the PostgreSQL server before the
# first start; when false the role expects them pre-created.
# Логическое значение. Создать базу и её роль на сервере PostgreSQL до первого
# запуска; при false роль ожидает их уже созданными.
keycloak_manage_database: true

# String. Privileged account used only to create the database and the role;
# Keycloak itself connects as keycloak_db_user.
# Строка. Привилегированная учётная запись только для создания базы и роли;
# сам Keycloak подключается как keycloak_db_user.
keycloak_db_admin_user: "postgres"

# String or null. Name of the variable holding the privileged password;
# required when keycloak_manage_database is true.
# Строка или null. Имя переменной с привилегированным паролем; обязательно,
# когда keycloak_manage_database равен true.
keycloak_db_admin_password_var: null

# List of strings. Internal: packages the community.postgresql modules need on
# the target host; postgres is the only supported backend.
# Список строк. Внутренний: пакеты, нужные модулям community.postgresql на
# целевом хосте; postgres - единственный поддерживаемый бэкенд.
keycloak_database_packages:
  - "python3-psycopg2"

# Public URL and HTTP listener
# Публичный URL и HTTP-слушатель

# String or null. Public base URL of this instance; required. Behind Traefik this
# is the external HTTPS name, for example
# "https://keycloak.dragons-nest.home.arpa". Hostname v2 derives the HTTPS
# requirement from the scheme of this URL.
# Строка или null. Публичный базовый URL этого экземпляра; обязателен. За Traefik
# это внешнее HTTPS-имя, например "https://keycloak.dragons-nest.home.arpa".
# Hostname v2 выводит требование HTTPS из схемы этого URL.
keycloak_hostname: null

# Boolean. hostname-strict of hostname v2: reject requests whose Host does not
# match the configured hostname.
# Логическое значение. hostname-strict в hostname v2: отвергать запросы, чей Host
# не совпадает с настроенным hostname.
keycloak_hostname_strict: true

# Boolean. Serve plain HTTP on the listener below. True here because Traefik
# terminates TLS and this port is reachable only inside SERVICES.
# Логическое значение. Отдавать чистый HTTP на слушателе ниже. Здесь true, потому
# что TLS завершает Traefik, а порт доступен только внутри SERVICES.
keycloak_http_enabled: true

# Integer. HTTP listener port.
# Целое число. Порт HTTP-слушателя.
keycloak_http_port: 8080

# String. Which forwarding headers from the reverse proxy Keycloak trusts.
# "xforwarded" is the current option for proxies sending X-Forwarded-* headers;
# Traefik sends them.
# Строка. Каким заголовкам пересылки от обратного прокси доверяет Keycloak.
# "xforwarded" — актуальная опция для прокси, передающих X-Forwarded-*; Traefik
# их передаёт.
keycloak_proxy_headers: "xforwarded"

# Dict. Additional option=value pairs appended to keycloak.conf verbatim, for
# options the role does not model directly.
# Словарь. Дополнительные пары опция=значение, дословно добавляемые в
# keycloak.conf, для опций, которые роль напрямую не моделирует.
keycloak_extra_options: {}

# Bootstrap administrator
# Начальный администратор

# String. Username of the bootstrap administrator created on the first start via
# KC_BOOTSTRAP_ADMIN_USERNAME.
# Строка. Имя начального администратора, создаваемого при первом старте через
# KC_BOOTSTRAP_ADMIN_USERNAME.
keycloak_admin_user: "admin"

# String or null. Name of the variable holding the bootstrap administrator
# password, taken from VARS/secrets.yml; required. The value reaches the server
# through KC_BOOTSTRAP_ADMIN_PASSWORD in the environment file.
# Строка или null. Имя переменной с паролем начального администратора из
# VARS/secrets.yml; обязательно. Значение доходит до сервера через
# KC_BOOTSTRAP_ADMIN_PASSWORD в файле окружения.
keycloak_admin_password_var: null

# Environment file
# Файл окружения

# String. File with the secret environment read by the systemd unit through
# EnvironmentFile. Lives outside the release tree so an upgrade cannot remove it.
# Строка. Файл с секретным окружением, читаемый systemd-юнитом через
# EnvironmentFile. Лежит вне дерева выпуска, чтобы обновление не могло его снести.
keycloak_env_file: "/etc/keycloak/keycloak.env"

# Service
# Сервис

# String. Name of the managed systemd unit.
# Строка. Имя управляемого systemd-юнита.
keycloak_service_name: "keycloak"

# String. Steady state of the service: started or stopped. Restarts are performed
# by the handler on configuration changes, never by this value.
# Строка. Устойчивое состояние сервиса: started или stopped. Перезапуск при
# изменении конфигурации выполняет handler, а не это значение.
keycloak_service_state: "started"

# Boolean. Start the service at boot.
# Логическое значение. Запускать сервис при загрузке.
keycloak_service_enabled: true
