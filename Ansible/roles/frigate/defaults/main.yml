---
# Frigate deployment configuration
# Конфигурация развертывания Frigate

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
frigate_debug_mode: false

# String. Docker Compose project directory.
# Строка. Каталог проекта Docker Compose.
frigate_project_directory: "/opt/frigate"

# String. Directory for persistent Frigate media.
# Строка. Каталог для постоянных медиа Frigate.
frigate_media_directory: "/mnt/frigate"

# String. Frigate container image.
# Строка. Образ контейнера Frigate.
frigate_image: "ghcr.io/blakeblackshear/frigate:stable"

# String. Frigate container name.
# Строка. Имя контейнера Frigate.
frigate_container_name: "frigate"

# String. Container shared-memory size.
# Строка. Размер общей памяти контейнера.
frigate_shm_size: "1gb"

# List. Host devices explicitly exposed to the Frigate container.
# Список. Устройства хоста, явно передаваемые контейнеру Frigate.
frigate_devices: []

# List. Host port mappings published by Frigate.
# Список. Сопоставления портов хоста, публикуемые Frigate.
frigate_ports:
  - "5000:5000"
  - "8554:8554"
  - "8555:8555/tcp"
  - "8555:8555/udp"
