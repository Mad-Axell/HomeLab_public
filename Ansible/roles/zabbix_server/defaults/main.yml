---
# Zabbix server configuration
# Конфигурация сервера Zabbix

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
zabbix_server_debug_mode: false

# Packages
# Пакеты

# Zabbix comes from Debian itself, not from the vendor repository.
#
# The vendor repository publishes no amd64 packages for Debian 13 at all - its sources file
# even says Architectures: all, and dists/trixie/main/binary-amd64/Packages.gz is a 404. Its
# 7.0 LTS branch has no trixie suite either. Debian 13 meanwhile ships Zabbix 7.0.22, which
# is the same LTS line, gets Debian security updates and needs no third-party trust.
#
# Pinning a vendor version here would therefore be a promise the archive cannot keep. Track
# what the distribution offers instead, and revisit only when the vendor publishes amd64.
#
# Zabbix берётся из самого Debian, а не из репозитория вендора.
#
# Репозиторий вендора не публикует для Debian 13 пакетов amd64 вовсе - в его sources-файле
# так и написано Architectures: all, а dists/trixie/main/binary-amd64/Packages.gz отдаёт 404.
# У ветки 7.0 LTS сюиты trixie тоже нет. Debian 13 при этом поставляет Zabbix 7.0.22 - ту же
# линию LTS, с обновлениями безопасности Debian и без доверия третьей стороне.
#
# Фиксировать здесь версию вендора значило бы обещать то, чего в архиве нет. Ориентируйтесь
# на то, что даёт дистрибутив, и пересматривайте, только когда вендор выложит amd64.
zabbix_server_packages:
  - "zabbix-server-pgsql"
  - "zabbix-frontend-php"
  - "php-fpm"
  - "nginx"
  - "postgresql-client"
  - "python3-psycopg2"

# List of strings. Packages of the vendor repository to remove if present. Its apt sources
# shadow nothing useful on this platform and only add a third party to the trust path.
# Список строк. Пакеты репозитория вендора, удаляемые при наличии. Его apt-источники на этой
# платформе ничего полезного не дают и лишь добавляют третью сторону в цепочку доверия.
zabbix_server_unwanted_packages:
  - "zabbix-release"

# Database
# База данных

zabbix_server_database_host: "127.0.0.1"
zabbix_server_database_port: 5432
zabbix_server_database_name: "zabbix"
zabbix_server_database_user: "zabbix"

# String or null. Name of the variable holding the database password.
# Строка или null. Имя переменной с паролем к базе.
zabbix_server_database_password_var: null

# Boolean. Create the database and its role before loading the schema.
# Логическое значение. Создать базу и её роль до загрузки схемы.
zabbix_server_manage_database: true

# String. Privileged account used only to create the database and the role.
# Строка. Привилегированная учётная запись только для создания базы и роли.
zabbix_server_database_admin_user: "postgres"

# String or null. Name of the variable holding the privileged password.
# Строка или null. Имя переменной с привилегированным паролем.
zabbix_server_database_admin_password_var: null

# String. Directory holding the compressed schema shipped by zabbix-server-pgsql.
# Строка. Каталог со сжатой схемой, поставляемой пакетом zabbix-server-pgsql.
zabbix_server_schema_directory: "/usr/share/zabbix-server-pgsql"

# List of strings. Schema parts, loaded in this order and no other.
#
# Debian splits what upstream ships as one file into three, and the split is not cosmetic:
# schema creates the tables, data seeds the Admin account and every stock template, images
# fills the icon tables. Loading only the first leaves a structurally valid database with no
# user able to log in and no template to attach - which reads as a broken frontend rather
# than as an incomplete import.
#
# Список строк. Части схемы, загружаемые именно в этом порядке.
#
# Debian делит то, что апстрим поставляет одним файлом, на три, и деление не косметическое:
# schema создаёт таблицы, data засевает учётную запись Admin и все штатные шаблоны, images
# заполняет таблицы значков. Загрузка одного лишь первого оставляет структурно корректную
# базу, в которую некому войти и не из чего привязать шаблон, - что читается как сломанный
# веб-интерфейс, а не как незавершённый импорт.
zabbix_server_schema_files:
  - "schema.sql.gz"
  - "images.sql.gz"
  - "data.sql.gz"

# Server
# Сервер

zabbix_server_listen_port: 10051

# String. Drop-in this role owns. The shipped zabbix_server.conf already ends with an active
# Include of this directory, so the distribution file is never rewritten and keeps whatever
# the next package version changes in it. Being included last, these values win.
# Строка. Drop-in, которым владеет роль. Поставляемый zabbix_server.conf уже заканчивается
# активным Include этого каталога, поэтому файл дистрибутива не переписывается и сохраняет
# всё, что изменит следующая версия пакета. Подключаясь последними, эти значения побеждают.
zabbix_server_config_path: "/etc/zabbix/zabbix_server.conf.d/10-ansible.conf"

# Integers. Pollers and related workers.
#
# Zabbix will not start when these exceed what the configuration allows, and it will run
# badly when they are too few: an exhausted poller queue delays every check on every host
# and shows up as hosts going unavailable in waves rather than as a capacity problem.
#
# Целые числа. Поллеры и смежные рабочие процессы.
#
# Zabbix не стартует, когда они превышают допустимое конфигурацией, и работает плохо, когда
# их слишком мало: исчерпанная очередь поллеров задерживает каждую проверку на каждом хосте
# и проявляется волнами недоступных хостов, а не как нехватка ёмкости.
zabbix_server_start_pollers: 5
zabbix_server_start_pollers_unreachable: 1
zabbix_server_start_trappers: 5
zabbix_server_start_discoverers: 1
zabbix_server_cache_size: "64M"
zabbix_server_history_cache_size: "32M"
zabbix_server_value_cache_size: "32M"

# Dict. Any further directive=value pairs appended to the server configuration.
# Словарь. Любые дополнительные пары директива=значение в конфигурации сервера.
zabbix_server_extra_settings: {}

# Frontend
# Веб-интерфейс

zabbix_server_frontend_port: 80

# Strings. Where the Debian packaging puts the interface. Upstream uses /usr/share/zabbix/ui
# and the two are easy to confuse; the wrong root gives nginx a directory with no index.php
# and a 403 that says nothing about which layout was expected.
# Строки. Куда веб-интерфейс кладут пакеты Debian. Апстрим использует /usr/share/zabbix/ui,
# и эти два пути легко перепутать; неверный корень даёт nginx каталог без index.php и 403,
# который ничего не говорит о том, какая раскладка ожидалась.
zabbix_server_frontend_root: "/usr/share/zabbix"
zabbix_server_frontend_config_path: "/usr/share/zabbix/conf/zabbix.conf.php"

# List of strings. Names and addresses the frontend answers to.
# Список строк. Имена и адреса, на которые отвечает веб-интерфейс.
zabbix_server_frontend_names: []

# String. Name shown in the interface header.
# Строка. Имя, отображаемое в заголовке интерфейса.
zabbix_server_frontend_title: "Zabbix"

# String. Time zone used by the frontend and by PHP.
# Строка. Часовой пояс веб-интерфейса и PHP.
zabbix_server_frontend_timezone: "Europe/Moscow"

# API account
# Учётная запись API

# String. Built-in super administrator. Zabbix creates it with the password "zabbix", which
# is public knowledge, so the role changes it on first run.
# Строка. Встроенный суперадминистратор. Zabbix создаёт его с паролем "zabbix", который
# общеизвестен, поэтому роль меняет его при первом прогоне.
zabbix_server_api_user: "Admin"

# String. Password Zabbix ships with; used once, to replace itself.
# Строка. Пароль, с которым поставляется Zabbix; используется один раз, чтобы себя сменить.
zabbix_server_api_initial_password: "zabbix"

# String or null. Name of the variable holding the password the account must end up with.
# Строка или null. Имя переменной с паролем, который учётная запись должна получить.
zabbix_server_api_password_var: null

# Services
# Сервисы

zabbix_server_service_state: "started"
zabbix_server_service_enabled: true
