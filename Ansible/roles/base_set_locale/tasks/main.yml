---
# Validate the supported platform and requested locale.
# Проверка поддерживаемой платформы и запрошенной локали.
- name: Validate locale configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - set_locale_name is string
      - set_locale_name | length > 0
    fail_msg: "set_locale supports Debian-family systems and requires a non-empty locale name."

# Install locale data required for locale generation.
# Установка данных локалей, необходимых для генерации локали.
- name: Install locale packages
  ansible.builtin.apt:
    name: "locales"
    state: present
    update_cache: true
  register: set_locale_package_result

# Generate the selected locale on the target system.
# Генерация выбранной локали на целевой системе.
- name: Generate selected locale
  community.general.locale_gen:
    name: "{{ set_locale_name }}"
    state: present
  register: set_locale_generation_result

# Configure the generated locale as the system default.
# Настройка сгенерированной локали как системного значения по умолчанию.
- name: Configure system locale
  ansible.builtin.lineinfile:
    path: "/etc/default/locale"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ set_locale_name }}"
    create: true
    mode: "0644"
  loop:
    - key: "LANG"
    - key: "LC_ALL"
  loop_control:
    label: "{{ item.key }}"
  register: set_locale_configuration_result

# Report locale changes without duplicating module output.
# Вывод изменений локали без дублирования вывода модулей.
- name: Display locale change summary
  ansible.builtin.debug:
    msg: "System locale {{ 'would change' if ansible_check_mode else 'changed' }} to {{ set_locale_name }}."
  when:
    - set_locale_debug_mode | bool
    - >-
      (set_locale_package_result.changed | default(false) | bool)
      or (set_locale_generation_result.changed | default(false) | bool)
      or (set_locale_configuration_result.changed | default(false) | bool)
  tags:
    - debug
