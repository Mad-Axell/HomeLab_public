---
# Validate the Debian platform and package configuration.
# Проверка платформы Debian и конфигурации пакетов.
- name: Validate Docker configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - docker_packages is sequence
      - docker_packages | length > 0
      - docker_users is sequence
    fail_msg: "docker supports Debian-family systems and requires valid package and user lists."

# Install tools required to use a signed APT repository.
# Установка инструментов, требуемых для использования подписанного APT-репозитория.
- name: Install Docker repository prerequisites
  ansible.builtin.apt:
    name:
      - "ca-certificates"
      - "curl"
    state: present
    update_cache: true
  register: docker_prerequisite_result

# Create the keyring directory for the Docker repository key.
# Создание каталога keyring для ключа репозитория Docker.
- name: Create Docker APT keyring directory
  ansible.builtin.file:
    path: "/etc/apt/keyrings"
    state: directory
    mode: "0755"
  register: docker_keyring_directory_result

# Download the Docker signing key without using apt-key.
# Загрузка ключа подписи Docker без использования apt-key.
- name: Download Docker APT signing key
  ansible.builtin.get_url:
    url: "{{ docker_repository_key_url }}"
    dest: "/etc/apt/keyrings/docker.asc"
    mode: "0644"
  register: docker_key_result

# Register the official Docker repository for the current Debian release.
# Регистрация официального репозитория Docker для текущего релиза Debian.
- name: Configure Docker APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_architecture }} signed-by=/etc/apt/keyrings/docker.asc]
      {{ docker_repository_url }} {{ ansible_facts.distribution_release }} stable
    filename: "docker"
    state: present
  register: docker_repository_result

# Install Docker Engine and its declared plugins.
# Установка Docker Engine и объявленных плагинов.
- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  register: docker_package_result

# Ensure Docker has the requested service state.
# Обеспечение запрошенного состояния сервиса Docker.
- name: Manage Docker service
  ansible.builtin.systemd:
    name: "{{ docker_service_name }}"
    state: "{{ docker_service_state }}"
    enabled: "{{ docker_service_enabled }}"
  register: docker_service_result

# Add declared existing users to the Docker group.
# Добавление объявленных существующих пользователей в группу Docker.
- name: Add users to Docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: "docker"
    append: true
  loop: "{{ docker_users }}"
  register: docker_user_result

# Report Docker installation changes without printing module results.
# Вывод изменений установки Docker без печати результатов модулей.
- name: Display Docker change summary
  ansible.builtin.debug:
    msg: "Docker Engine {{ 'would change' if ansible_check_mode else 'changed' }}."
  when:
    - docker_debug_mode | bool
    - >-
      (docker_prerequisite_result.changed | default(false) | bool)
      or (docker_keyring_directory_result.changed | default(false) | bool)
      or (docker_key_result.changed | default(false) | bool)
      or (docker_repository_result.changed | default(false) | bool)
      or (docker_package_result.changed | default(false) | bool)
      or (docker_service_result.changed | default(false) | bool)
      or (docker_user_result.changed | default(false) | bool)
  tags:
    - debug
