---
# Docker Engine configuration
# Конфигурация Docker Engine

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
docker_debug_mode: false

# String. Docker APT repository URL for Debian.
# Строка. URL Docker APT-репозитория для Debian.
docker_repository_url: "https://download.docker.com/linux/debian"

# String. Docker repository signing-key URL.
# Строка. URL ключа подписи репозитория Docker.
docker_repository_key_url: "https://download.docker.com/linux/debian/gpg"

# String. APT architecture for Docker packages.
# Строка. APT-архитектура для пакетов Docker.
docker_apt_architecture: "amd64"

# List. Docker packages installed from the official repository.
# Список. Пакеты Docker, устанавливаемые из официального репозитория.
docker_packages:
  - "docker-ce"
  - "docker-ce-cli"
  - "containerd.io"
  - "docker-buildx-plugin"
  - "docker-compose-plugin"

# String. Docker systemd service name.
# Строка. Имя systemd-сервиса Docker.
docker_service_name: "docker"

# String. Desired stable Docker service state.
# Строка. Желаемое устойчивое состояние сервиса Docker.
docker_service_state: "started"

# Boolean. Enable Docker at boot.
# Логическое значение. Включает Docker при загрузке.
docker_service_enabled: true

# List. Existing users added to the docker group.
# Список. Существующие пользователи, добавляемые в группу docker.
docker_users: []
