---
# NAS share configuration
# Конфигурация NAS-ресурса

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
nas_server_debug_mode: false

# String. Required directory exported by the NAS services.
# Строка. Обязательный каталог, экспортируемый NAS-сервисами.
nas_server_share_path: null

# String. Samba share name.
# Строка. Имя общего ресурса Samba.
nas_server_share_name: "data"

# Boolean. Publish the share using Samba.
# Логическое значение. Публикует ресурс через Samba.
nas_server_samba_enabled: true

# Boolean. Allow guest access to the Samba share.
# Логическое значение. Разрешает гостевой доступ к ресурсу Samba.
nas_server_samba_guest_ok: false

# Boolean. Publish the share using NFS.
# Логическое значение. Публикует ресурс через NFS.
nas_server_nfs_enabled: false

# List. NFS client CIDRs or host addresses allowed to mount the share.
# Список. CIDR или адреса NFS-клиентов, которым разрешено монтировать ресурс.
nas_server_nfs_clients: []
