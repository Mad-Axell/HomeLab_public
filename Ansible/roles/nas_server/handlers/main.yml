---
# Restart Samba after its managed configuration changes. nmbd is restarted too because it
# reads the same file and would otherwise keep announcing the previous share list.
# Перезапуск Samba после изменения управляемой конфигурации. nmbd перезапускается тоже,
# поскольку читает тот же файл и иначе продолжит анонсировать прежний список ресурсов.
- name: Restart Samba
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - "smbd"
    - "nmbd"

# Reload NFS exports after the export definition changes.
# Перезагрузка NFS exports после изменения определения экспорта.
- name: Reload NFS exports
  ansible.builtin.command:
    cmd: "exportfs -ra"
  changed_when: false
