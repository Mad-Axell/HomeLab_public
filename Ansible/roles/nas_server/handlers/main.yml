---
# Restart Samba after its managed configuration changes.
# Перезапуск Samba после изменения управляемой конфигурации.
- name: Restart Samba
  ansible.builtin.systemd:
    name: "smbd"
    state: restarted

# Reload NFS exports after the export definition changes.
# Перезагрузка NFS exports после изменения определения экспорта.
- name: Reload NFS exports
  ansible.builtin.command:
    cmd: "exportfs -ra"
  changed_when: false
