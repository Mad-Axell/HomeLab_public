---
# Validate the role inputs before any change on the host
# Проверка входных параметров роли до любых изменений на хосте
- name: Validate Whisper-WebUI inputs
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - whisper_webui_version is string
      - (whisper_webui_auth_user_var is none) == (whisper_webui_auth_password_var is none)
    fail_msg: >-
      whisper_webui requires Debian, a release version and either both basic-auth
      variable names or neither.

# Secrets reach the role through variable names, never literal values; the check
# proves each name resolves in VARS/secrets.yml before a template references it
# Секреты попадают в роль через имена переменных, а не литералами; проверка
# убеждается, что каждое имя разрешается в VARS/secrets.yml, прежде чем шаблон
# на него ссылается
- name: Validate the optional secrets
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default=none) is not none
    fail_msg: "A variable named in the whisper_webui configuration must exist in VARS/secrets.yml."
  loop: >-
    {{ ([whisper_webui_auth_user_var] if whisper_webui_auth_user_var is not none else [])
       + ([whisper_webui_auth_password_var] if whisper_webui_auth_password_var is not none else [])
       + ([whisper_webui_diarization_token_var] if whisper_webui_diarization_token_var is not none else []) }}
  loop_control:
    label: "redacted"
  no_log: true

# Install runtime and build packages
# Установка пакетов рантайма и сборки
- name: Install Whisper-WebUI packages
  ansible.builtin.apt:
    name: "{{ whisper_webui_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: whisper_webui_package_result

# Create the system account the service runs as and the tree belongs to
# Создание системной учётной записи, от которой работает сервис и которой
# принадлежит дерево
- name: Create the Whisper-WebUI system account
  ansible.builtin.user:
    name: "{{ whisper_webui_system_user }}"
    system: true
    shell: "/usr/sbin/nologin"
    home: "{{ whisper_webui_install_root }}"
    create_home: false

# Models and outputs live outside the versioned tree so an upgrade, which
# replaces that tree, cannot take gigabytes of cached models with it
# Модели и результаты лежат вне версионированного дерева, чтобы обновление,
# которое это дерево заменяет, не унесло с собой гигабайты кэша моделей
- name: Create the data root
  ansible.builtin.file:
    path: "{{ whisper_webui_data_root }}"
    state: directory
    owner: "{{ whisper_webui_system_user }}"
    group: "{{ whisper_webui_system_user }}"
    mode: "0755"

# Check whether this release is already unpacked before downloading anything
# Проверка, распакован ли уже этот выпуск, до какой-либо загрузки
- name: Check whether this Whisper-WebUI release is already unpacked
  ansible.builtin.stat:
    path: "{{ whisper_webui_release_dir }}/app.py"
  register: whisper_webui_release_stat

# Download and unpack the release; the extracted tree is owned by the service
# account because the application creates models/, outputs/ and backend/cache
# inside it at import time
# Загрузка и распаковка выпуска; распакованное дерево принадлежит сервисной
# учётной записи, потому что приложение создаёт внутри него models/, outputs/ и
# backend/cache при импорте
- name: Download and unpack Whisper-WebUI
  ansible.builtin.unarchive:
    src: "{{ whisper_webui_download_url }}"
    dest: "/opt"
    remote_src: true
    owner: "{{ whisper_webui_system_user }}"
    group: "{{ whisper_webui_system_user }}"
    creates: "{{ whisper_webui_release_dir }}/app.py"
  register: whisper_webui_unarchive_result
  notify: Restart Whisper WebUI

# The install root is a symlink to the versioned directory: an upgrade swaps one
# symlink, and so does a rollback
# Корень установки - симлинк на версионированный каталог: обновление сводится к
# смене одного симлинка, и откат тоже
- name: Point the install root at this release
  ansible.builtin.file:
    src: "{{ whisper_webui_release_dir }}"
    dest: "{{ whisper_webui_install_root }}"
    state: link
    force: true
  register: whisper_webui_symlink_result

# The upstream requirements.txt asks for the CUDA wheel index, whose wheel host
# download-r2.pytorch.org is unreachable from the lab WAN; the line is dropped
# and PyTorch arrives as locally installed wheels instead
# Апстримный requirements.txt просит CUDA-индекс wheel-пакетов, чей хост
# wheel-файлов download-r2.pytorch.org недоступен из WAN лаборатории; строка
# удаляется, а PyTorch приезжает локально установленными wheel-файлами
- name: Drop the PyTorch wheel index
  ansible.builtin.replace:
    path: "{{ whisper_webui_install_root }}/requirements.txt"
    regexp: '^--extra-index-url\s+\S+'
    replace: ''
  register: whisper_webui_index_result

# Unpinned git+ requirements reinstall on every pip run and break idempotency;
# pin each one to a reviewed commit
# Незакреплённые git+-зависимости переустанавливаются при каждом запуске pip и
# ломают идемпотентность; закрепляем каждую на проверенном коммите
- name: Pin the VCS requirements to reviewed commits
  ansible.builtin.replace:
    path: "{{ whisper_webui_install_root }}/requirements.txt"
    regexp: '^(git\+https://github\.com/jhj0517/{{ item }}\.git)$'
    replace: '\1@{{ whisper_webui_pinned_git_deps[item] }}'
  loop: "{{ whisper_webui_pinned_git_deps | dict2items | map(attribute='key') | list }}"
  loop_control:
    label: "{{ item }}"
  register: whisper_webui_pin_result

# The jhj0517-whisper line is dropped: pip cannot patch a remote clone, so the
# fork is installed from the patched local clone prepared below
# Строка jhj0517-whisper удаляется: pip не умеет патчить удалённый клон, поэтому
# форк ставится из пропатченного локального клона, подготовленного ниже
- name: Drop the jhj0517-whisper VCS requirement
  ansible.builtin.replace:
    path: "{{ whisper_webui_install_root }}/requirements.txt"
    regexp: '^git\+https://github\.com/jhj0517/jhj0517-whisper\.git.*$'
    replace: ''
  register: whisper_webui_drop_result

# faster-whisper decodes audio via av.open(..., metadata_errors="ignore"); the
# kwarg exists in PyAV 11-15 and was removed by av 16+, while requirements.txt
# leaves av unpinned and the resolver picked 19.x
# faster-whisper декодирует аудио через av.open(..., metadata_errors="ignore");
# параметр есть в PyAV 11-15 и удалён в av 16+, а requirements.txt оставляет av
# незакреплённым и резолвер выбрал 19.x
- name: Pin PyAV below the metadata_errors removal
  ansible.builtin.lineinfile:
    path: "{{ whisper_webui_install_root }}/requirements.txt"
    regexp: '^av[<>=]'
    line: "av>=11,<16"
    insertafter: EOF
  register: whisper_webui_av_pin_result

# Fetch the fork as a tarball snapshot: a clone would reject the patched
# working tree on rerun, while unarchive is idempotent
# Загрузка форка tarball-снапшотом: клон отказывался бы от пропатченного
# рабочего дерева при повторе, а unarchive идемпотентен
- name: Download the jhj0517-whisper fork snapshot
  ansible.builtin.get_url:
    url: "{{ whisper_webui_whisper_fork_url }}"
    dest: "{{ whisper_webui_build_root }}/jhj0517-whisper-{{ whisper_webui_whisper_fork_commit }}.tar.gz"
    mode: "0644"
    timeout: 60
  register: whisper_webui_fork_download_result

# Unpack the fork snapshot
# Распаковка снапшота форка
- name: Unpack the jhj0517-whisper fork snapshot
  ansible.builtin.unarchive:
    src: "{{ whisper_webui_build_root }}/jhj0517-whisper-{{ whisper_webui_whisper_fork_commit }}.tar.gz"
    dest: "{{ whisper_webui_build_root }}"
    remote_src: true
  register: whisper_webui_fork_unpack_result

# Python 3.13 (PEP 667) no longer populates locals() from exec(): the fork's
# read_version gets a KeyError '__version__' and the build dies. runpy.run_path
# executes the version file the way the original code intended.
# Python 3.13 (PEP 667) больше не наполняет locals() из exec(): read_version
# форка ловит KeyError '__version__' и сборка умирает. runpy.run_path
# выполняет файл версии так, как задумывал изначальный код.
- name: Patch the fork's version reader for Python 3.13
  ansible.builtin.replace:
    path: "{{ whisper_webui_whisper_fork_dir }}/setup.py"
    regexp: '    return locals\(\)\["__version__"\]'
    replace: '    return __import__("runpy").run_path(fname)["__version__"]'
  register: whisper_webui_fork_patch_result

# Create the Python virtual environment
# Создание виртуального окружения Python
- name: Create the Whisper-WebUI virtual environment
  ansible.builtin.command:
    cmd: "/usr/bin/python3 -m venv {{ whisper_webui_install_root }}/venv"
    creates: "{{ whisper_webui_install_root }}/venv/bin/python"

# Create the wheel staging directory; get_url does not make missing parents
# Создание каталога под wheel-файлы; get_url не создаёт отсутствующие родители
- name: Create the PyTorch wheels directory
  ansible.builtin.file:
    path: "{{ whisper_webui_build_root }}/wheels"
    state: directory
    mode: "0755"

# Fetch the CPU PyTorch wheels through the reachable front end; the default
# index host is dead from this network
# Загрузка CPU-сборок PyTorch через доступный фронт; основной хост индекса из
# этой сети мёртв
- name: Download the PyTorch CPU wheels
  ansible.builtin.get_url:
    url: "{{ item.url }}"
    dest: "{{ whisper_webui_build_root }}/wheels/{{ item.file }}"
    mode: "0644"
    timeout: 120
  loop: "{{ whisper_webui_torch_wheels }}"
  loop_control:
    label: "{{ item.file }}"
  register: whisper_webui_wheels_result

# Install the wheels before the fork and requirements: their torch/torchaudio
# requirements are then already satisfied and pip never queries the dead index
# Установка wheel-файлов до форка и requirements: их требования torch/torchaudio
# уже удовлетворены, и pip никогда не обращается к мёртвому индексу
- name: Install the PyTorch CPU wheels
  ansible.builtin.pip:
    name: "{{ whisper_webui_build_root }}/wheels/{{ item.file }}"
    virtualenv: "{{ whisper_webui_install_root }}/venv"
  loop: "{{ whisper_webui_torch_wheels }}"
  loop_control:
    label: "{{ item.file }}"
  register: whisper_webui_wheels_pip_result

# Pin setuptools inside the build environments of the VCS requirements: the
# jhj0517-whisper setup.py imports pkg_resources, which setuptools 81+ removed
# Закрепление setuptools внутри сборочных окружений VCS-зависимостей: setup.py
# пакета jhj0517-whisper импортирует pkg_resources, которое setuptools 81+
# удалил
- name: Write the pip build constraints file
  ansible.builtin.copy:
    content: "{{ whisper_webui_build_constraints }}\n"
    dest: "{{ whisper_webui_install_root }}/build-constraints.txt"
    owner: "{{ whisper_webui_system_user }}"
    group: "{{ whisper_webui_system_user }}"
    mode: "0644"

# Check whether the fork is already in the venv: a local-directory pip install
# rebuilds unconditionally, so it needs an explicit idempotency guard
# Проверка, стоит ли форк уже в venv: установка из локального каталога
# пересобирает безусловно, поэтому ей нужен явный страж идемпотентности
- name: Check whether the whisper fork is already installed
  ansible.builtin.stat:
    path: "{{ whisper_webui_install_root }}/venv/lib/python{{ ansible_facts['python']['version']['major'] }}.{{ ansible_facts['python']['version']['minor'] }}/site-packages/whisper"
  register: whisper_webui_fork_installed

# Install the patched whisper fork from the local clone; PIP_CONSTRAINT reaches
# its isolated build environment and keeps setuptools<81 for pkg_resources
# Установка пропатченного форка whisper из локального клона; PIP_CONSTRAINT
# достаёт до его изолированного сборочного окружения и держит там setuptools<81
# ради pkg_resources
- name: Install the patched jhj0517-whisper fork
  ansible.builtin.pip:
    name: "{{ whisper_webui_whisper_fork_dir }}"
    virtualenv: "{{ whisper_webui_install_root }}/venv"
  environment:
    PIP_CONSTRAINT: "{{ whisper_webui_install_root }}/build-constraints.txt"
  when: >-
    not (whisper_webui_fork_installed.stat.exists | default(false))
    or (whisper_webui_fork_unpack_result.changed | default(false) | bool)
    or (whisper_webui_fork_patch_result.changed | default(false) | bool)
  register: whisper_webui_fork_pip_result

# Install the Python dependencies; this pulls the CPU PyTorch stack and takes a
# while on first run. PIP_CONSTRAINT is inherited by the pip invocations inside
# the isolated build environments, so it is what pins setuptools<81 for the
# VCS requirements; a plain -c option would not reach them.
# Установка зависимостей Python; тянет CPU-стек PyTorch и при первом запуске
# занимает время. PIP_CONSTRAINT наследуется вызовами pip внутри изолированных
# сборочных окружений, поэтому именно она закрепляет setuptools<81 для
# VCS-зависимостей; обычная опция -c до них не дотягивается.
- name: Install the Whisper-WebUI Python dependencies
  ansible.builtin.pip:
    requirements: "{{ whisper_webui_install_root }}/requirements.txt"
    virtualenv: "{{ whisper_webui_install_root }}/venv"
  environment:
    PIP_CONSTRAINT: "{{ whisper_webui_install_root }}/build-constraints.txt"
  register: whisper_webui_pip_result
  notify: Restart Whisper WebUI

# Render the default parameters: preselected model, language, VAD and the
# optional diarization token resolved through its variable name
# Рендер параметров по умолчанию: предвыбранные модель, язык, VAD и опциональный
# токен диаризации, разрешаемый по имени переменной
- name: Configure the Whisper-WebUI defaults
  ansible.builtin.template:
    src: "default_parameters.yaml.j2"
    dest: "{{ whisper_webui_install_root }}/configs/default_parameters.yaml"
    owner: "{{ whisper_webui_system_user }}"
    group: "{{ whisper_webui_system_user }}"
    mode: "0644"
  no_log: true
  diff: false
  notify: Restart Whisper WebUI
  register: whisper_webui_config_result

# The unit may carry basic-auth credentials in its command line, so it is
# written unreadable by anyone but root
# Юнит может нести учётные данные basic-auth в командной строке, поэтому
# записывается нечитаемым ни для кого, кроме root
- name: Install the Whisper-WebUI systemd unit
  ansible.builtin.template:
    src: "whisper-webui.service.j2"
    dest: "/etc/systemd/system/whisper-webui.service"
    owner: "root"
    group: "root"
    mode: "0640"
  no_log: true
  diff: false
  notify:
    - Reload systemd
    - Restart Whisper WebUI
  register: whisper_webui_unit_result

# Flush now: the daemon reload must happen before the service can be managed,
# and the pending restart gets the unit's final definition
# Немедленный flush: перезагрузка демона обязана случиться до управления
# сервисом, а отложенный перезапуск получает финальное описание юнита
- name: Apply Whisper-WebUI handler runs
  ansible.builtin.meta: flush_handlers

# Preload the selected faster-whisper models into the shared data root so the
# first transcription does not stall on a Hugging Face download
# Предзагрузка выбранных моделей faster-whisper в общий каталог данных, чтобы
# первая транскрипция не вставала на скачивании с Hugging Face
- name: Preload the faster-whisper models
  vars:
    whisper_webui_repo_dir: >-
      {{ (whisper_webui_model_repos[item] | default('Systran/faster-whisper-' ~ item)) | replace('/', '--') }}
  ansible.builtin.command:
    argv:
      - "{{ whisper_webui_install_root }}/venv/bin/python"
      - "-c"
      - >-
        from faster_whisper import WhisperModel;
        WhisperModel('{{ item }}', device='cpu', compute_type='int8',
        download_root='{{ whisper_webui_data_root }}/models/Whisper/faster-whisper')
    creates: >-
      {{ whisper_webui_data_root }}/models/Whisper/faster-whisper/models--{{ whisper_webui_repo_dir }}
  become: true
  become_user: "{{ whisper_webui_system_user }}"
  environment: >-
    {{ {'HF_ENDPOINT': whisper_webui_hf_endpoint} if whisper_webui_hf_endpoint | length > 0 else {} }}
  loop: "{{ whisper_webui_preload_models }}"
  loop_control:
    label: "{{ item }}"
  register: whisper_webui_preload_result

# Manage the desired service state; restarts happen through the handler
# Управление требуемым состоянием сервиса; перезапуски идут через handler
- name: Manage the Whisper-WebUI service state
  ansible.builtin.systemd:
    name: "whisper-webui"
    state: "{{ whisper_webui_service_state }}"
    enabled: "{{ whisper_webui_service_enabled }}"
  register: whisper_webui_service_result

# Display the change summary
# Отображение сводки об изменениях
- name: Display Whisper-WebUI change summary
  ansible.builtin.debug:
    msg: >-
      Whisper-WebUI {{ whisper_webui_version }} on {{ whisper_webui_server_name }}:{{ whisper_webui_server_port }},
      default model {{ whisper_webui_default_model }}, {{ whisper_webui_preload_models | length }} model(s) preloaded.
  when:
    - whisper_webui_debug_mode | bool
    - >-
      (whisper_webui_package_result.changed | default(false) | bool)
      or (whisper_webui_unarchive_result.changed | default(false) | bool)
      or (whisper_webui_pip_result.changed | default(false) | bool)
      or (whisper_webui_config_result.changed | default(false) | bool)
      or (whisper_webui_unit_result.changed | default(false) | bool)
      or (whisper_webui_preload_result.changed | default(false) | bool)
      or (whisper_webui_service_result.changed | default(false) | bool)
  tags:
    - debug
