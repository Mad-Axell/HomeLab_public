---
# Unbound resolver configuration
# Конфигурация резолвера Unbound

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
dns_unbound_debug_mode: false

# String. Unbound systemd service name.
# Строка. Имя systemd-сервиса Unbound.
dns_unbound_service_name: "unbound"

# String. Desired stable service state.
# Строка. Желаемое устойчивое состояние сервиса.
dns_unbound_service_state: "started"

# Boolean. Enable the resolver at boot.
# Логическое значение. Включает резолвер при загрузке.
dns_unbound_service_enabled: true

# String. Local address used by the resolver.
# Строка. Локальный адрес, используемый резолвером.
dns_unbound_listen_address: "127.0.0.1"

# Integer. Local resolver listener port.
# Целое число. Порт локального слушателя резолвера.
dns_unbound_listen_port: 5335

# Integer. Number of Unbound worker threads.
# Целое число. Число рабочих потоков Unbound.
dns_unbound_num_threads: 2

# String. URL of the DNS root hints file.
# Строка. URL файла корневых DNS-подсказок.
dns_unbound_root_hints_url: "https://www.internic.net/domain/named.cache"

# String. Managed Unbound configuration path.
# Строка. Путь к управляемой конфигурации Unbound.
dns_unbound_config_path: "/etc/unbound/unbound.conf.d/10-server.conf"

# String. DNSSEC trust-anchor path.
# Строка. Путь к DNSSEC trust anchor.
dns_unbound_root_key_path: "/var/lib/unbound/root.key"

# String. Root hints destination path.
# Строка. Путь назначения root hints.
dns_unbound_root_hints_path: "/var/lib/unbound/root.hints"
