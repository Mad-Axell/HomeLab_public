---
# Validate the platform and the required Loki endpoint before changing anything
# Проверка платформы и обязательного endpoint Loki до внесения изменений
- name: Assert required Promtail variables are defined
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - promtail_loki_url is string
      - (promtail_loki_url | trim | length) > 0
    fail_msg: "promtail requires Debian and a non-empty promtail_loki_url."
    quiet: true

# Install the tools needed to fetch and use the signed repository
# Установка инструментов, необходимых для получения и использования подписанного репозитория
- name: Install the repository prerequisites
  ansible.builtin.apt:
    name: "{{ promtail_prerequisite_packages }}"
    state: present
    update_cache: true
  register: promtail_prerequisite_result

# Create the directory that holds the repository signing key
# Создание каталога, хранящего ключ подписи репозитория
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: "{{ promtail_keyring_directory }}"
    state: directory
    mode: "0755"
  register: promtail_keyring_directory_result

# Download the Grafana signing key without using the deprecated apt-key
# Загрузка ключа подписи Grafana без использования устаревшего apt-key
- name: Download the Grafana APT signing key
  ansible.builtin.get_url:
    url: "{{ promtail_repository_key_url }}"
    dest: "{{ promtail_keyring_directory }}/{{ promtail_keyring_file }}"
    mode: "0644"
  register: promtail_key_result

# Register the Grafana repository that ships the promtail package
# Регистрация репозитория Grafana, который поставляет пакет promtail
- name: Configure the Grafana APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ promtail_repository_arch }}
      signed-by={{ promtail_keyring_directory }}/{{ promtail_keyring_file }}]
      {{ promtail_repository_url }} {{ promtail_repository_suite }} {{ promtail_repository_component }}
    filename: "grafana"
    state: present
  register: promtail_repository_result

# Install the Promtail package and its packaged service unit
# Установка пакета Promtail и поставляемого им сервисного юнита
- name: Install the Promtail package
  ansible.builtin.apt:
    name: "{{ promtail_packages }}"
    state: present
    update_cache: true
  register: promtail_package_result

# The journal job reads this directory; Debian keeps a persistent journal
# there by default, and creating it keeps the path valid where the journal is
# volatile
# Journal-задание читает этот каталог; Debian по умолчанию ведёт в нём
# постоянный журнал, а создание каталога сохраняет путь рабочим там, где
# журнал временный
- name: Create the journald directory
  ansible.builtin.file:
    path: "{{ promtail_journal_path }}"
    state: directory
    owner: "root"
    group: "systemd-journal"
    mode: "2755"
  register: promtail_journal_dir_result

# The positions file lives in a state directory the package does not create
# Файл позиций лежит в каталоге состояния, который пакет не создаёт
- name: Create the Promtail state directory
  ansible.builtin.file:
    path: "{{ promtail_positions_file | dirname }}"
    state: directory
    owner: "{{ promtail_service_user }}"
    mode: "0750"
  register: promtail_state_dir_result

# Reading the sources needs group rights the package does not grant; the
# running process picks them up after the restart the notify requests
# Чтение источников требует групповых прав, которых пакет не даёт; работающий
# процесс получит их после перезапуска, запрошенного через notify
- name: Grant the Promtail user read access to the log sources
  ansible.builtin.user:
    name: "{{ promtail_service_user }}"
    groups: "{{ promtail_user_groups }}"
    append: true
  notify: Restart Promtail
  register: promtail_user_result

# Replace the shipped example config; the freshly installed binary checks the
# rendered file before it is put in place
# Замена поставляемой примерной конфигурации; свежеустановленный бинарь
# проверяет отрендеренный файл до его размещения
- name: Configure Promtail
  ansible.builtin.template:
    src: "config.yml.j2"
    dest: "{{ promtail_config_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
    validate: "/usr/bin/promtail -config.file %s -check-syntax"
  notify: Restart Promtail
  register: promtail_config_result

# Keep the Promtail service in its steady state
# Поддержание устойчивого состояния сервиса Promtail
- name: Manage the Promtail service
  ansible.builtin.systemd_service:
    name: "{{ promtail_service_name }}"
    state: "{{ promtail_service_state }}"
    enabled: "{{ promtail_service_enabled }}"
  register: promtail_service_result

# Apply the pending restart so Promtail immediately runs on the managed
# configuration with the new group membership
# Применение ожидающего перезапуска, чтобы Promtail сразу работал на
# управляемой конфигурации с новым членством в группах
- name: Apply pending Promtail restarts
  ansible.builtin.meta: flush_handlers

# Report the outcome without repeating the package manager output
# Вывод итога без повторения вывода пакетного менеджера
- name: Display the Promtail change summary
  ansible.builtin.debug:
    msg: >-
      Promtail {{ 'WOULD CHANGE' if ansible_check_mode else 'CHANGED' }}:
      pushing to {{ promtail_loki_url }},
      journal {{ promtail_journal_path }}, files {{ promtail_varlog_path }}.
  when:
    - promtail_debug_mode | bool
    - >-
      (promtail_prerequisite_result is defined
      and (promtail_prerequisite_result.changed | default(false) | bool))
      or (promtail_keyring_directory_result is defined
      and (promtail_keyring_directory_result.changed | default(false) | bool))
      or (promtail_key_result is defined
      and (promtail_key_result.changed | default(false) | bool))
      or (promtail_repository_result is defined
      and (promtail_repository_result.changed | default(false) | bool))
      or (promtail_package_result is defined
      and (promtail_package_result.changed | default(false) | bool))
      or (promtail_journal_dir_result is defined
      and (promtail_journal_dir_result.changed | default(false) | bool))
      or (promtail_state_dir_result is defined
      and (promtail_state_dir_result.changed | default(false) | bool))
      or (promtail_user_result is defined
      and (promtail_user_result.changed | default(false) | bool))
      or (promtail_config_result is defined
      and (promtail_config_result.changed | default(false) | bool))
      or (promtail_service_result is defined
      and (promtail_service_result.changed | default(false) | bool))
  tags:
    - debug
