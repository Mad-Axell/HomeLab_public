---
# Boolean. Show a summary of applied changes.
# Логическое значение. Показывать сводку применённых изменений.
netbox_seed_debug_mode: false

# String or null. Base URL of the NetBox instance, for example
# "http://172.25.40.15". Required: the role talks only to the REST API.
# Строка или null. Базовый URL инстанса NetBox, например "http://172.25.40.15".
# Обязательна: роль общается только с REST API.
netbox_seed_api_url: null

# String or null. Name of the variable holding the API token in the
# 'nbt_<key>.<plaintext>' form. Required; the value lives in VARS/secrets.yml.
# Строка или null. Имя переменной с токеном API вида 'nbt_<key>.<plaintext>'.
# Обязательна; значение живёт в VARS/secrets.yml.
netbox_seed_api_token_var: null

# Boolean. Verify TLS certificates when the API URL is https.
# Логическое значение. Проверять TLS-сертификаты, когда URL API - https.
netbox_seed_validate_certs: true

# String. Desired state for every managed object.
# Строка. Желаемое состояние для всех управляемых объектов.
netbox_seed_state: "present"

# Lists of module data dicts, applied in dependency order. Every item is passed
# verbatim as the `data` argument of the matching netbox.netbox module, so the
# fields are exactly those the module documents.
# Списки словарей данных модулей, применяемые в порядке зависимостей. Каждый
# элемент передаётся как есть в аргумент `data` соответствующего модуля
# netbox.netbox, поэтому поля - в точности те, что документирует модуль.
netbox_seed_rirs: []
netbox_seed_sites: []
# Locations are site children used for devices placed in rooms instead of a
# rack position (workstations, TVs, wall-mounted gear).
# Локации - потомки сайта для устройств, стоящих в помещениях, а не в стойке
# (рабочие станции, телевизоры, настенное оборудование).
netbox_seed_locations: []
netbox_seed_racks: []
netbox_seed_manufacturers: []
netbox_seed_device_roles: []
netbox_seed_ipam_roles: []
netbox_seed_device_types: []
netbox_seed_vlan_groups: []
netbox_seed_vlans: []
# Wireless LAN groups and WLANs (SSIDs). A WLAN references its VLAN by name.
# Группы беспроводных сетей и сами WLAN (SSID). WLAN ссылается на VLAN по имени.
netbox_seed_wireless_lan_groups: []
netbox_seed_wireless_lans: []
netbox_seed_cluster_types: []
netbox_seed_clusters: []
netbox_seed_prefixes: []
netbox_seed_devices: []
# Device bays live on parent devices and hold child devices; each entry needs
# name, device (the parent) and installed_device (the child).
# Device bays живут на parent-устройствах и держат child-устройства; каждая
# запись содержит name, device (родителя) и installed_device (потомка).
netbox_seed_device_bays: []
netbox_seed_virtual_machines: []
netbox_seed_device_interfaces: []
netbox_seed_vm_interfaces: []
# Cables connect two already existing terminations; each entry needs
# termination_a_type/termination_b_type (for example dcim.interface) and the
# matching termination_a/termination_b references.
# Кабели соединяют две уже существующие терминации; каждая запись содержит
# termination_a_type/termination_b_type (например dcim.interface) и ссылки
# termination_a/termination_b.
netbox_seed_cables: []
# Services describe which daemon runs on which device or VM; entries carry
# name, protocol, ports and a device or virtual_machine reference.
# Сервисы описывают, какой демон на каком устройстве или VM работает; записи
# содержат name, protocol, ports и ссылку device или virtual_machine.
netbox_seed_services: []
# MAC addresses are separate objects since NetBox 4.2; each entry needs
# mac_address plus an assigned_object reference to an existing interface.
# MAC-адреса - отдельные объекты начиная с NetBox 4.2; каждая запись содержит
# mac_address и ссылку assigned_object на существующий интерфейс.
netbox_seed_mac_addresses: []
netbox_seed_ip_addresses: []
