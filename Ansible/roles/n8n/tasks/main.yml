---
# Validate required external variables before changing anything. Names are
# checked, never values, so the assert needs no no_log.
# Проверка обязательных внешних переменных до внесения изменений. Проверяются
# имена, а не значения, поэтому no_log не нужен.
- name: Assert required variables are defined
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - n8n_db_host is string
      - (n8n_db_host | string | trim | length) > 0
      - n8n_db_password_var is not none
      - n8n_encryption_key_var is not none
      - not (n8n_manage_database | bool) or n8n_db_admin_password_var is not none
    fail_msg: >-
      n8n requires Debian, a non-empty n8n_db_host, and the secret variable
      names n8n_db_password_var and n8n_encryption_key_var. Managing the
      database additionally requires n8n_db_admin_password_var.
    quiet: true

# Verify the secrets named by the *_var variables actually exist; the loop
# checks variable names, never their values.
# Проверка, что секреты, названные в переменных *_var, реально существуют;
# цикл проверяет имена переменных, а не их значения.
- name: Validate the n8n secrets
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.vars', item, default=none) is not none
    fail_msg: "A variable named in the n8n configuration must exist in VARS/secrets.yml."
  loop: >-
    {{ [n8n_db_password_var, n8n_encryption_key_var]
       + ([n8n_db_admin_password_var] if n8n_manage_database | bool else []) }}
  loop_control:
    label: "redacted"
  no_log: true

# Install the Python driver the community.postgresql modules need on this
# host; postgres is the only supported backend.
# Установка Python-драйвера, нужного модулям community.postgresql на этом
# хосте; postgres - единственный поддерживаемый бэкенд.
- name: Install the PostgreSQL module dependencies
  ansible.builtin.apt:
    name: "{{ n8n_database_packages }}"
    state: present
  register: n8n_database_packages_result

# The service owns the database it lives in, as every application here does.
# Сервер владеет базой, в которой живёт, как и всякое приложение здесь.
- name: Create the n8n database role
  community.postgresql.postgresql_user:
    name: "{{ n8n_db_user }}"
    password: "{{ lookup('ansible.builtin.vars', n8n_db_password_var) }}"
    role_attr_flags: "LOGIN"
    login_host: "{{ n8n_db_host }}"
    login_port: "{{ n8n_db_port }}"
    login_user: "{{ n8n_db_admin_user }}"
    login_password: "{{ lookup('ansible.builtin.vars', n8n_db_admin_password_var) }}"
    login_db: "postgres"
    state: present
  when: n8n_manage_database | bool
  no_log: true
  register: n8n_db_role_result

# Create the n8n database owned by its application role
# Создание базы n8n, принадлежащей её прикладной роли
- name: Create the n8n database
  community.postgresql.postgresql_db:
    name: "{{ n8n_db_name }}"
    owner: "{{ n8n_db_user }}"
    encoding: "UTF-8"
    template: "template0"
    login_host: "{{ n8n_db_host }}"
    login_port: "{{ n8n_db_port }}"
    login_user: "{{ n8n_db_admin_user }}"
    login_password: "{{ lookup('ansible.builtin.vars', n8n_db_admin_password_var) }}"
    state: present
  when: n8n_manage_database | bool
  no_log: true
  register: n8n_db_result

# Create the Compose project directory for compose.yml and .env.
# Создание каталога проекта Compose для compose.yml и .env.
- name: Create the n8n project directory
  ansible.builtin.file:
    path: "{{ n8n_project_directory }}"
    state: directory
    mode: "0755"
  register: n8n_project_directory_result

# Create the persistent data directory owned by uid/gid 1000, the node account
# the n8n container runs as; without the right ownership the container cannot
# write its state.
# Создание каталога постоянных данных, принадлежащего uid/gid 1000 - учётной
# записи node, от имени которой работает контейнер n8n; без правильного
# владельца контейнер не может писать своё состояние.
- name: Create the n8n data directory
  ansible.builtin.file:
    path: "{{ n8n_data_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    mode: "0755"
  register: n8n_data_directory_result

# Deploy the Compose definition for the managed n8n container; the file holds
# no secrets, the credentials and the encryption key live in .env below.
# Развертывание определения Compose для управляемого контейнера n8n; в файле
# нет секретов, учётные данные и ключ шифрования лежат в .env ниже.
- name: Configure the n8n Docker Compose project
  ansible.builtin.template:
    src: "Docker_Compose_N8n.j2"
    dest: "{{ n8n_project_directory }}/compose.yml"
    mode: "0644"
  register: n8n_compose_result

# Write the environment file compose feeds to the container. The file holds
# the database password and the encryption key: the task logs nothing and
# produces no diff.
# Запись файла окружения, который compose передаёт контейнеру. Файл содержит
# пароль базы и ключ шифрования: задача ничего не пишет в лог и не даёт diff.
- name: Configure the n8n environment file
  ansible.builtin.template:
    src: "n8n.env.j2"
    dest: "{{ n8n_project_directory }}/.env"
    mode: "0640"
  no_log: true
  diff: false
  register: n8n_env_result

# Start or update n8n through the Docker Compose v2 module; a changed
# compose.yml or .env recreates the container through the module itself, so
# no restart handler is needed.
# Запуск или обновление n8n через модуль Docker Compose v2; изменённый
# compose.yml или .env пересоздаёт контейнер самим модулем, поэтому handler
# перезапуска не нужен.
- name: Deploy the n8n container
  community.docker.docker_compose_v2:
    project_src: "{{ n8n_project_directory }}"
    files:
      - "compose.yml"
    state: "{{ n8n_state }}"
  register: n8n_deployment_result

# Report the deployment result; results that can carry secrets are read only
# by their changed flag.
# Вывод результата развертывания; у результатов, могущих нести секреты,
# читается только флаг changed.
- name: Display the n8n change summary
  ansible.builtin.debug:
    msg: >-
      n8n deployment {{ 'WOULD CHANGE' if ansible_check_mode else 'CHANGED' }}:
      web port {{ n8n_web_port }}, database {{ n8n_db_name }}@{{ n8n_db_host }}.
  when:
    - n8n_debug_mode | bool
    - >-
      (n8n_database_packages_result is defined
      and (n8n_database_packages_result.changed | default(false) | bool))
      or (n8n_db_role_result is defined
      and (n8n_db_role_result.changed | default(false) | bool))
      or (n8n_db_result is defined
      and (n8n_db_result.changed | default(false) | bool))
      or (n8n_project_directory_result is defined
      and (n8n_project_directory_result.changed | default(false) | bool))
      or (n8n_data_directory_result is defined
      and (n8n_data_directory_result.changed | default(false) | bool))
      or (n8n_compose_result is defined
      and (n8n_compose_result.changed | default(false) | bool))
      or (n8n_env_result is defined
      and (n8n_env_result.changed | default(false) | bool))
      or (n8n_deployment_result is defined
      and (n8n_deployment_result.changed | default(false) | bool))
  tags:
    - debug
