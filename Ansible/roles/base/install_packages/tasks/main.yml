---
# Validate the requested package operation before changing the host.
# Проверка запрошенной операции с пакетами до изменения хоста.
- name: Validate package management input
  ansible.builtin.assert:
    that:
      - install_packages_names is not none
      - install_packages_names is sequence
      - install_packages_names | length > 0
      - install_packages_state in ['present', 'absent']
    fail_msg: "install_packages_names must be a non-empty list and install_packages_state must be present or absent."

# Apply the requested state to all declared packages.
# Применение запрошенного состояния ко всем объявленным пакетам.
- name: Manage declared packages
  ansible.builtin.package:
    name: "{{ install_packages_names }}"
    state: "{{ install_packages_state }}"
  register: install_packages_result

# Report package changes without duplicating package-manager output.
# Вывод изменений пакетов без дублирования вывода менеджера пакетов.
- name: Display package change summary
  ansible.builtin.debug:
    msg: "Declared packages {{ 'would change' if ansible_check_mode else 'changed' }}."
  when:
    - install_packages_debug_mode | bool
    - install_packages_result.changed | default(false) | bool
  tags:
    - debug
