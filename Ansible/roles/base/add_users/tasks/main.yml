---
# Validate the public user-account input before changing the host.
# Проверка публичного ввода учетных записей до изменения хоста.
- name: Validate user account input
  ansible.builtin.assert:
    that:
      - add_users_users is sequence
      - add_users_groups is sequence
      - add_users_users | selectattr('name', 'defined') | list | length == add_users_users | length
      - add_users_users | map(attribute='name') | list | unique | length == add_users_users | length
      - add_users_users | map(attribute='name') | select('match', '^[a-z_][a-z0-9_-]*[$]?$') | list | length == add_users_users | length
    fail_msg: "add_users_users must contain unique valid account names and add_users_groups must be a list."

# Verify password-hash secrets without exposing their values.
# Проверка секретов хэшей паролей без раскрытия их значений.
- name: Validate user password hash secrets
  ansible.builtin.assert:
    that:
      - item.password_hash_var is not defined or lookup('ansible.builtin.vars', item.password_hash_var, default=none) is not none
    fail_msg: "A password_hash_var declared for a user must exist in VARS/secrets.yml."
  loop: "{{ add_users_users }}"
  loop_control:
    label: "redacted user"
  no_log: true

# Install sudo only when at least one managed user needs sudo membership.
# Установка sudo только когда хотя бы одному управляемому пользователю нужна группа sudo.
- name: Install sudo for privileged users
  ansible.builtin.package:
    name: "sudo"
    state: present
  when: add_users_users | selectattr('sudo', 'defined') | selectattr('sudo') | list | length > 0
  register: add_users_sudo_package_result

# Create explicitly declared supplementary groups.
# Создание явно объявленных дополнительных групп.
- name: Create declared supplementary groups
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  loop: "{{ add_users_groups }}"
  register: add_users_group_result

# Create groups referenced by managed users before assigning memberships.
# Создание групп из учетных записей до назначения членства.
- name: Create user supplementary groups
  ansible.builtin.group:
    name: "{{ item.1 }}"
    state: present
  loop: "{{ query('subelements', add_users_users, 'groups', {'skip_missing': true}) }}"
  loop_control:
    label: "{{ item.1 }}"
  register: add_users_user_group_result

# Create or update user accounts without logging password hashes.
# Создание или обновление учетных записей без вывода хэшей паролей.
- name: Manage user accounts
  ansible.builtin.user:
    name: "{{ item.name }}"
    comment: "{{ item.comment if item.comment is defined and item.comment != '' else omit }}"
    groups: "{{ (item.groups | default([])) + (['sudo'] if item.sudo | default(false) | bool else []) }}"
    append: true
    shell: "{{ item.shell if item.shell is defined and item.shell != '' else add_users_default_shell }}"
    home: "{{ item.home if item.home is defined and item.home != '' else add_users_home_prefix + '/' + item.name }}"
    create_home: "{{ item.create_home if item.create_home is defined else add_users_create_home }}"
    uid: "{{ item.uid if item.uid is defined and item.uid is not none else omit }}"
    password: "{{ lookup('ansible.builtin.vars', item.password_hash_var) if item.password_hash_var is defined else omit }}"
    update_password: "on_create"
    state: present
  loop: "{{ add_users_users }}"
  loop_control:
    label: "redacted user"
  no_log: true
  diff: false
  register: add_users_user_result

# Apply the requested permissions to created home directories.
# Применение запрошенных прав к созданным домашним каталогам.
- name: Set managed home directory permissions
  ansible.builtin.file:
    path: "{{ item.home if item.home is defined and item.home != '' else add_users_home_prefix + '/' + item.name }}"
    owner: "{{ item.name }}"
    group: "{{ item.name }}"
    mode: "{{ add_users_home_mode }}"
    state: directory
  loop: "{{ add_users_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.create_home | default(add_users_create_home) | bool
  register: add_users_home_result

# Report the aggregate account-management result without revealing secrets.
# Вывод агрегированного результата управления учетными записями без раскрытия секретов.
- name: Display user account change summary
  ansible.builtin.debug:
    msg: "User account configuration {{ 'would change' if ansible_check_mode else 'changed' }}."
  when:
    - add_users_debug_mode | bool
    - >-
      (add_users_sudo_package_result is defined and add_users_sudo_package_result.changed | default(false) | bool)
      or (add_users_group_result is defined and add_users_group_result.changed | default(false) | bool)
      or (add_users_user_group_result is defined and add_users_user_group_result.changed | default(false) | bool)
      or (add_users_user_result is defined and add_users_user_result.changed | default(false) | bool)
      or (add_users_home_result is defined and add_users_home_result.changed | default(false) | bool)
  tags:
    - debug
