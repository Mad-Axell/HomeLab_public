---
# User account configuration
# Конфигурация учетных записей пользователей

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
add_users_debug_mode: false

# Boolean. Create home directories unless an item overrides the value.
# Логическое значение. Создает домашние каталоги, если элемент не переопределяет значение.
add_users_create_home: true

# String. Default shell for managed users.
# Строка. Оболочка по умолчанию для управляемых пользователей.
add_users_default_shell: "/bin/bash"

# String. Parent directory used for default home paths.
# Строка. Родительский каталог для путей домашних каталогов по умолчанию.
add_users_home_prefix: "/home"

# String. Permissions applied to managed home directories.
# Строка. Права, применяемые к управляемым домашним каталогам.
add_users_home_mode: "0750"

# List. Users to create or update; password_hash_var refers to vault_add_users_<name>_password_hash.
# Список. Пользователи для создания или обновления; password_hash_var ссылается на vault_add_users_<name>_password_hash.
add_users_users: []

# List. Supplementary groups created before managing users.
# Список. Дополнительные группы, создаваемые до управления пользователями.
add_users_groups: []
