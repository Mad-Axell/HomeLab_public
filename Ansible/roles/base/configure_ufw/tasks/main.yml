---
# Validate the firewall contract before changing network access.
# Проверка контракта файрвола до изменения сетевого доступа.
- name: Validate UFW configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - configure_ufw_rules is not none
      - configure_ufw_rules is sequence
      - configure_ufw_rules | selectattr('rule', 'defined') | list | length == configure_ufw_rules | length
      - configure_ufw_rules | selectattr('port', 'defined') | list | length == configure_ufw_rules | length
      - configure_ufw_rules | selectattr('proto', 'defined') | list | length == configure_ufw_rules | length
    fail_msg: "configure_ufw supports Debian-family systems and requires explicit rules with rule, port, and proto."

# Install the firewall package before applying its policy.
# Установка пакета файрвола до применения его политики.
- name: Install UFW
  ansible.builtin.apt:
    name: "ufw"
    state: present
    update_cache: true
  register: configure_ufw_package_result

# Set UFW default incoming and outgoing policies.
# Установка политик UFW по умолчанию для входящего и исходящего трафика.
- name: Set UFW default policies  # noqa args[module]
  community.general.ufw:
    direction: "{{ item.direction }}"
    policy: "{{ item.policy }}"
  loop:
    - direction: "incoming"
      policy: "{{ configure_ufw_default_incoming_policy }}"
    - direction: "outgoing"
      policy: "{{ configure_ufw_default_outgoing_policy }}"
  loop_control:
    label: "{{ item.direction }}: {{ item.policy }}"
  register: configure_ufw_policy_result

# Configure the requested UFW logging level.
# Настройка запрошенного уровня журналирования UFW.
- name: Configure UFW logging
  community.general.ufw:
    logging: "{{ configure_ufw_logging }}"
  register: configure_ufw_logging_result

# Apply explicitly declared firewall rules.
# Применение явно объявленных правил файрвола.
- name: Apply UFW rules
  community.general.ufw:
    rule: "{{ item.rule }}"
    port: "{{ item.port }}"
    proto: "{{ item.proto }}"
    from_ip: "{{ item.from_ip if item.from_ip is defined and item.from_ip is not none and item.from_ip != '' else omit }}"
    comment: "{{ item.comment if item.comment is defined and item.comment is not none and item.comment != '' else omit }}"
  loop: "{{ configure_ufw_rules }}"
  loop_control:
    label: "{{ item.rule }} {{ item.port }}/{{ item.proto }}"
  register: configure_ufw_rule_result

# Enable UFW after its policy and rules are in place.
# Включение UFW после настройки политики и правил.
- name: Enable UFW
  community.general.ufw:
    state: enabled
  register: configure_ufw_enable_result

# Report firewall changes without printing the complete rule set.
# Вывод изменений файрвола без печати полного набора правил.
- name: Display UFW change summary
  ansible.builtin.debug:
    msg: "UFW configuration {{ 'would change' if ansible_check_mode else 'changed' }}."
  when:
    - configure_ufw_debug_mode | bool
    - >-
      (configure_ufw_package_result.changed | default(false) | bool)
      or (configure_ufw_policy_result.changed | default(false) | bool)
      or (configure_ufw_logging_result.changed | default(false) | bool)
      or (configure_ufw_rule_result.changed | default(false) | bool)
      or (configure_ufw_enable_result.changed | default(false) | bool)
  tags:
    - debug
