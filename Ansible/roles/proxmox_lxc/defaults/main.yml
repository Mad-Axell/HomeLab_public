---
# Inventory alias of the LXC container managed by this role.
proxmox_lxc_target_host: null

# Proxmox API connection. The role runs the API module on the controller.
proxmox_lxc_api_host: "{{ ansible_host }}"
proxmox_lxc_api_user: null
proxmox_lxc_api_password: null
proxmox_lxc_validate_certs: false
proxmox_lxc_timeout: 60

# Credentials applied only when the container is created.
proxmox_lxc_root_password: null
proxmox_lxc_pubkey: null

# Desired container lifecycle. Deletion is intentionally outside this role.
proxmox_lxc_start_after_create: true
proxmox_lxc_onboot: true

# Container resources.
proxmox_lxc_ostemplate: null
proxmox_lxc_cores: 1
proxmox_lxc_cpus: 1
proxmox_lxc_cpuunits: 1000
proxmox_lxc_memory: 512
proxmox_lxc_swap: 512
proxmox_lxc_disk_storage: "local-lvm"
proxmox_lxc_disk_size: 8
proxmox_lxc_features: []
proxmox_lxc_unprivileged: true
proxmox_lxc_description: "Managed by Ansible"

# Complete set of Proxmox mount points managed through the API module.
proxmox_lxc_mount_volumes: []

# Raw LXC lines unsupported by community.proxmox.proxmox, for example
# device passthrough or AppArmor settings. Each item needs regexp and line.
proxmox_lxc_extra_config_lines: []

# Report changes without printing API credentials or container passwords.
proxmox_lxc_debug_mode: false
