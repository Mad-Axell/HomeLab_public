---
# Inventory alias of the LXC container managed by this role.
proxmox_lxc_target_host: null

# Proxmox API connection. The role runs the API module on the controller.
proxmox_lxc_api_host: "{{ ansible_host }}"
proxmox_lxc_api_user: null
proxmox_lxc_api_password: null
proxmox_lxc_validate_certs: false
proxmox_lxc_timeout: 60

# Credentials applied only when the container is created.
proxmox_lxc_root_password: null
proxmox_lxc_pubkey: null

# Desired container lifecycle. Deletion is intentionally outside this role.
proxmox_lxc_start_after_create: true
proxmox_lxc_onboot: true

# Appliance template download
# Загрузка шаблона из каталога appliance

# Boolean. Download the newest catalog template for the requested OS and use it instead of proxmox_lxc_ostemplate
# Логическое значение. Загрузить новейший шаблон каталога для указанной ОС и использовать его вместо proxmox_lxc_ostemplate
proxmox_lxc_template_download: false

# String or null. Required OS name prefix in the appliance catalog when the download is enabled, for example "debian-13"
# Строка или null. Обязательный префикс имени ОС в каталоге appliance при включённой загрузке, например "debian-13"
proxmox_lxc_template_os: null

# String. Storage that receives the downloaded template
# Строка. Хранилище, в которое загружается шаблон
proxmox_lxc_template_storage: "local"

# String. Appliance catalog section that holds OS templates
# Строка. Раздел каталога appliance, содержащий шаблоны ОС
proxmox_lxc_template_section: "system"

# String. Template architecture used to filter catalog entries
# Строка. Архитектура шаблона для фильтрации записей каталога
proxmox_lxc_template_arch: "amd64"

# Integer. Seconds allowed for the template download, which is slower than other API calls
# Целое число. Секунды на загрузку шаблона, которая медленнее остальных вызовов API
proxmox_lxc_template_timeout: 600

# Container resources.
proxmox_lxc_ostemplate: null
proxmox_lxc_cores: 1
# Integer or null. NOT the core count; the core count is proxmox_lxc_cores.
# Целое число или null. НЕ количество ядер; количество ядер — proxmox_lxc_cores.
#
# Default is null: the parameter is omitted and the container keeps whatever it
# has. Do not set a value without reading why — community.proxmox 1.6.0 maps it
# to two different Proxmox settings depending on the code path:
#   create (proxmox.py:1194): kwargs["cpuunits"] = kwargs.pop("cpus")
#   update (proxmox.py:1051): kwargs["cpulimit"] = kwargs.pop("cpus")
# The role also sends cpuunits, so on creation cpus overwrites it. With the
# former default of 0 every new container got cpuunits: 0, which cgroup v2
# rejects (cpu.weight must be 1-10000), and the container was created but would
# not start:
#   cgfsng_setup_limits: Numerical result out of range -
#   Failed to set "cpu.weight" to "0"
# Because the same value cannot mean cpulimit and cpuunits at once, this role
# does not manage cpulimit. Set cpuunits through proxmox_lxc_cpuunits.
#
# Дефолт — null: параметр не передаётся, контейнер сохраняет своё значение.
# Не задавайте значение, не прочитав причину: в community.proxmox 1.6.0 этот
# параметр отображается на две разные настройки Proxmox в зависимости от ветки —
# при создании он затирает cpuunits, при обновлении уходит в cpulimit. Прежний
# дефолт 0 записывал cpuunits: 0, что запрещено в cgroup v2, и контейнер
# создавался, но не стартовал. Управлять cpulimit этой ролью нельзя; вес CPU
# задаётся через proxmox_lxc_cpuunits.
proxmox_lxc_cpus: null
proxmox_lxc_cpuunits: 1000
proxmox_lxc_memory: 512
proxmox_lxc_swap: 512
proxmox_lxc_disk_storage: "local-lvm"
proxmox_lxc_disk_size: 8
proxmox_lxc_features: []
proxmox_lxc_unprivileged: true
proxmox_lxc_description: "Managed by Ansible"

# Complete set of Proxmox mount points managed through the API module.
proxmox_lxc_mount_volumes: []

# Raw LXC lines unsupported by community.proxmox.proxmox, for example
# device passthrough or AppArmor settings. Each item needs regexp and line.
proxmox_lxc_extra_config_lines: []

# Report changes without printing API credentials or container passwords.
proxmox_lxc_debug_mode: false
