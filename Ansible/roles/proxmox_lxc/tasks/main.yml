---
- name: Validate Proxmox LXC target alias
  ansible.builtin.assert:
    that:
      - proxmox_lxc_target_host is string
      - proxmox_lxc_target_host | length > 0
      - proxmox_lxc_target_host in hostvars
    fail_msg: "proxmox_lxc_target_host must name an inventory LXC host."

- name: Read Proxmox LXC target data from inventory
  ansible.builtin.set_fact:
    proxmox_lxc_target: "{{ hostvars[proxmox_lxc_target_host] }}"

- name: Resolve target-specific Proxmox LXC settings
  ansible.builtin.set_fact:
    proxmox_lxc_effective:
      api_node: >-
        {{
          hostvars[inventory_hostname].proxmox.api_node
          | default(inventory_hostname)
        }}
      cores: "{{ proxmox_lxc_target.proxmox_lxc_cores | default(proxmox_lxc_cores) }}"
      cpus: "{{ proxmox_lxc_target.proxmox_lxc_cpus | default(proxmox_lxc_cpus) }}"
      cpuunits: >-
        {{ proxmox_lxc_target.proxmox_lxc_cpuunits | default(proxmox_lxc_cpuunits) }}
      memory: "{{ proxmox_lxc_target.proxmox_lxc_memory | default(proxmox_lxc_memory) }}"
      swap: "{{ proxmox_lxc_target.proxmox_lxc_swap | default(proxmox_lxc_swap) }}"
      disk_storage: >-
        {{ proxmox_lxc_target.proxmox_lxc_disk_storage | default(proxmox_lxc_disk_storage) }}
      disk_size: >-
        {{ proxmox_lxc_target.proxmox_lxc_disk_size | default(proxmox_lxc_disk_size) }}
      features: >-
        {{ proxmox_lxc_target.proxmox_lxc_features | default(proxmox_lxc_features) }}
      unprivileged: >-
        {{
          proxmox_lxc_target.proxmox_lxc_unprivileged
          | default(proxmox_lxc_unprivileged)
        }}
      mount_volumes: >-
        {{
          proxmox_lxc_target.proxmox_lxc_mount_volumes
          | default(proxmox_lxc_mount_volumes)
        }}
      extra_config_lines: >-
        {{
          proxmox_lxc_target.proxmox_lxc_extra_config_lines
          | default(proxmox_lxc_extra_config_lines)
        }}
      ostemplate: >-
        {{
          proxmox_lxc_target.proxmox_lxc_ostemplate
          | default(proxmox_lxc_ostemplate)
        }}
      description: >-
        {{
          proxmox_lxc_target.proxmox_lxc_description
          | default(proxmox_lxc_description)
        }}
      template_download: >-
        {{
          proxmox_lxc_target.proxmox_lxc_template_download
          | default(proxmox_lxc_template_download)
        }}
      template_os: >-
        {{
          proxmox_lxc_target.proxmox_lxc_template_os
          | default(proxmox_lxc_template_os)
        }}
      template_storage: >-
        {{
          proxmox_lxc_target.proxmox_lxc_template_storage
          | default(proxmox_lxc_template_storage)
        }}
      template_section: >-
        {{
          proxmox_lxc_target.proxmox_lxc_template_section
          | default(proxmox_lxc_template_section)
        }}
      template_arch: >-
        {{
          proxmox_lxc_target.proxmox_lxc_template_arch
          | default(proxmox_lxc_template_arch)
        }}

# Refresh the local appliance catalog so the newest template is visible
# Обновление локального каталога appliance, чтобы был виден новейший шаблон
- name: Refresh the Proxmox appliance template catalog
  ansible.builtin.command:
    cmd: "pveam update"
  register: proxmox_lxc_template_catalog_refresh_result
  changed_when: false
  failed_when: proxmox_lxc_template_catalog_refresh_result.rc not in [0, 255]
  check_mode: false
  when: proxmox_lxc_effective.template_download | bool

# Read the catalog entries offered for the configured section
# Чтение записей каталога, предлагаемых для настроенного раздела
- name: List Proxmox appliance templates
  ansible.builtin.command:
    cmd: "pveam available --section {{ proxmox_lxc_effective.template_section }}"
  register: proxmox_lxc_template_catalog_result
  changed_when: false
  check_mode: false
  when: proxmox_lxc_effective.template_download | bool

# Pick the highest version among the catalog entries of the requested OS and architecture
# Выбор наибольшей версии среди записей каталога для нужной ОС и архитектуры
- name: Select the newest catalog template for the requested OS
  ansible.builtin.set_fact:
    proxmox_lxc_template_latest: >-
      {{
        proxmox_lxc_template_catalog_result.stdout_lines
        | select('search', '\s' ~ proxmox_lxc_effective.template_os ~ '-\S*_'
                 ~ proxmox_lxc_effective.template_arch ~ '\.')
        | map('regex_replace', '^\S+\s+(\S+).*$', '\1')
        | community.general.version_sort
        | last | default('')
      }}
  when: proxmox_lxc_effective.template_download | bool

# Address the selected template by its storage volid, which is what the API expects
# Обращение к выбранному шаблону через volid хранилища, как того требует API
- name: Use the selected catalog template as the OS template
  ansible.builtin.set_fact:
    proxmox_lxc_effective: >-
      {{
        proxmox_lxc_effective
        | combine({
            'ostemplate': proxmox_lxc_effective.template_storage
                          ~ ':vztmpl/' ~ proxmox_lxc_template_latest
          })
      }}
  when:
    - proxmox_lxc_effective.template_download | bool
    - proxmox_lxc_template_latest | default('') | length > 0

- name: Validate Proxmox LXC API and inventory data
  ansible.builtin.assert:
    that:
      - proxmox_lxc_api_host is string
      - proxmox_lxc_api_host | length > 0
      - proxmox_lxc_api_user is string
      - proxmox_lxc_api_user | length > 0
      - proxmox_lxc_api_password is string
      - proxmox_lxc_api_password | length > 0
      - proxmox_lxc_target.proxmox.type == 'lxc'
      - proxmox_lxc_target.proxmox.node == inventory_hostname
      - proxmox_lxc_target.proxmox.vmid | int > 0
      - proxmox_lxc_target.ansible_host is defined
      - proxmox_lxc_target.network.interface is defined
      - proxmox_lxc_target.network.bridge is defined
      - proxmox_lxc_target.network.prefix | int > 0
      - proxmox_lxc_target.network.gateway is defined
      - proxmox_lxc_effective.ostemplate is string
      - proxmox_lxc_effective.ostemplate | length > 0
      - proxmox_lxc_effective.mount_volumes is sequence
      - proxmox_lxc_effective.extra_config_lines is sequence
      - >-
        not (proxmox_lxc_effective.template_download | bool)
        or (
          proxmox_lxc_effective.template_os is string
          and (proxmox_lxc_effective.template_os | trim | length) > 0
          and (proxmox_lxc_template_latest | default('') | length) > 0
        )
    fail_msg: >-
      Proxmox credentials, a valid LXC inventory object, and an OS template
      are required. Run this role on the Proxmox node that owns the target.
      With proxmox_lxc_template_download enabled, proxmox_lxc_template_os must
      name an OS that the appliance catalog actually offers.
  no_log: true

# Fetch the selected appliance template so container creation finds it on the storage
# Загрузка выбранного шаблона appliance, чтобы создание контейнера нашло его в хранилище
- name: Download the selected Proxmox appliance template
  community.proxmox.proxmox_template:
    api_host: "{{ proxmox_lxc_api_host }}"
    api_user: "{{ proxmox_lxc_api_user }}"
    api_password: "{{ proxmox_lxc_api_password }}"
    validate_certs: "{{ proxmox_lxc_validate_certs }}"
    node: "{{ proxmox_lxc_effective.api_node }}"
    storage: "{{ proxmox_lxc_effective.template_storage }}"
    content_type: "vztmpl"
    template: "{{ proxmox_lxc_template_latest }}"
    state: present
    timeout: "{{ proxmox_lxc_template_timeout }}"
  delegate_to: localhost
  become: false
  no_log: true
  register: proxmox_lxc_template_download_result
  when: proxmox_lxc_effective.template_download | bool

# Report the template download without exposing API credentials
# Отображение загрузки шаблона без раскрытия учётных данных API
- name: Display Proxmox appliance template download
  ansible.builtin.debug:
    msg: >-
      Appliance template {{ proxmox_lxc_template_latest }}:
      {{ 'WOULD DOWNLOAD' if ansible_check_mode else 'DOWNLOADED' }}
  when:
    - proxmox_lxc_debug_mode | bool
    - >-
      proxmox_lxc_template_download_result is defined
      and (proxmox_lxc_template_download_result.changed | default(false) | bool)
  tags:
    - debug

- name: Build the Proxmox net0 definition
  ansible.builtin.set_fact:
    proxmox_lxc_net0: >-
      {{
        (
          [
            'name=' ~ proxmox_lxc_target.network.interface,
            'bridge=' ~ proxmox_lxc_target.network.bridge,
            'ip=' ~ proxmox_lxc_target.ansible_host ~ '/' ~ (proxmox_lxc_target.network.prefix | string),
            'gw=' ~ proxmox_lxc_target.network.gateway,
            'firewall=' ~ (1 if proxmox_lxc_target.network.firewall | default(false) | bool else 0)
          ]
          + (['hwaddr=' ~ proxmox_lxc_target.network.mac] if proxmox_lxc_target.network.mac | default(none) is not none else [])
          + (['tag=' ~ (proxmox_lxc_target.network.vlan_tag | string)] if proxmox_lxc_target.network.vlan_tag | default(none) is not none else [])
        ) | join(',')
      }}

- name: Manage the Proxmox LXC through the API
  community.proxmox.proxmox:
    api_host: "{{ proxmox_lxc_api_host }}"
    api_user: "{{ proxmox_lxc_api_user }}"
    api_password: "{{ proxmox_lxc_api_password }}"
    validate_certs: "{{ proxmox_lxc_validate_certs }}"
    node: "{{ proxmox_lxc_effective.api_node }}"
    vmid: "{{ proxmox_lxc_target.proxmox.vmid }}"
    hostname: "{{ proxmox_lxc_target_host }}"
    ostemplate: "{{ proxmox_lxc_effective.ostemplate }}"
    cores: "{{ proxmox_lxc_effective.cores }}"
    cpus: "{{ proxmox_lxc_effective.cpus }}"
    cpuunits: "{{ proxmox_lxc_effective.cpuunits }}"
    memory: "{{ proxmox_lxc_effective.memory }}"
    swap: "{{ proxmox_lxc_effective.swap }}"
    disk_volume:
      storage: "{{ proxmox_lxc_effective.disk_storage }}"
      size: "{{ proxmox_lxc_effective.disk_size }}"
    netif:
      net0: "{{ proxmox_lxc_net0 }}"
    nameserver: "{{ proxmox_lxc_target.network.dns_servers | join(' ') }}"
    searchdomain: "{{ proxmox_lxc_target.network.search_domain }}"
    features: >-
      {{ proxmox_lxc_effective.features if proxmox_lxc_effective.features | length > 0 else omit }}
    unprivileged: "{{ proxmox_lxc_effective.unprivileged }}"
    mount_volumes: >-
      {{ proxmox_lxc_effective.mount_volumes if proxmox_lxc_effective.mount_volumes | length > 0 else omit }}
    password: >-
      {{ proxmox_lxc_root_password if proxmox_lxc_root_password is not none else omit }}
    pubkey: "{{ proxmox_lxc_pubkey if proxmox_lxc_pubkey is not none else omit }}"
    description: "{{ proxmox_lxc_effective.description }}"
    onboot: "{{ proxmox_lxc_onboot }}"
    state: present
    update: true
    timeout: "{{ proxmox_lxc_timeout }}"
  delegate_to: localhost
  become: false
  no_log: true
  register: proxmox_lxc_api_result

- name: Check the generated LXC configuration file
  ansible.builtin.stat:
    path: "/etc/pve/lxc/{{ proxmox_lxc_target.proxmox.vmid }}.conf"
  register: proxmox_lxc_config_stat
  when:
    - proxmox_lxc_effective.extra_config_lines | length > 0

- name: Validate raw LXC configuration lines
  ansible.builtin.assert:
    that:
      - item.regexp is defined
      - item.regexp is string
      - item.regexp | length > 0
      - item.line is defined
      - item.line is string
      - item.line | length > 0
      - item.state | default('present') in ['present', 'absent']
    fail_msg: "Every proxmox_lxc_extra_config_lines item needs regexp and line."
  loop: "{{ proxmox_lxc_effective.extra_config_lines }}"
  loop_control:
    label: "{{ item.regexp | default('invalid item') }}"

- name: Configure raw LXC settings unsupported by the API module
  ansible.builtin.lineinfile:
    path: "/etc/pve/lxc/{{ proxmox_lxc_target.proxmox.vmid }}.conf"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ proxmox_lxc_effective.extra_config_lines }}"
  loop_control:
    label: "{{ item.regexp }}"
  when:
    - proxmox_lxc_config_stat.stat.exists | default(false)
  register: proxmox_lxc_raw_config_result

- name: Start the Proxmox LXC
  community.proxmox.proxmox:
    api_host: "{{ proxmox_lxc_api_host }}"
    api_user: "{{ proxmox_lxc_api_user }}"
    api_password: "{{ proxmox_lxc_api_password }}"
    validate_certs: "{{ proxmox_lxc_validate_certs }}"
    node: "{{ proxmox_lxc_effective.api_node }}"
    vmid: "{{ proxmox_lxc_target.proxmox.vmid }}"
    state: started
    timeout: "{{ proxmox_lxc_timeout }}"
  delegate_to: localhost
  become: false
  no_log: true
  when:
    - proxmox_lxc_start_after_create | bool
  register: proxmox_lxc_start_result

- name: Display Proxmox LXC change summary
  ansible.builtin.debug:
    msg: >-
      LXC {{ proxmox_lxc_target.proxmox.vmid }} on
      {{ proxmox_lxc_effective.api_node }} was processed through the Proxmox API.
  when:
    - proxmox_lxc_debug_mode | bool
    - >-
      proxmox_lxc_api_result.changed | default(false) | bool
      or proxmox_lxc_start_result.changed | default(false) | bool
      or proxmox_lxc_raw_config_result.changed | default(false) | bool
  tags:
    - debug
