---
# Local DNS server configuration
# Конфигурация локального DNS-сервера

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
ns_server_debug_mode: false

# String. Local address where Unbound listens.
# Строка. Локальный адрес, где слушает Unbound.
ns_server_listen_address: "0.0.0.0"

# Integer. Local DNS listener port.
# Целое число. Порт локального DNS-слушателя.
ns_server_listen_port: 53

# List. Upstream DNS resolvers used by Unbound forwarding mode.
# Список. Вышестоящие DNS-резолверы в режиме пересылки Unbound.
ns_server_forward_addresses:
  - "1.1.1.1"
  - "9.9.9.9"
