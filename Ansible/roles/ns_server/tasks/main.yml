---
# Validate the platform and DNS forwarding input.
# Проверка платформы и входных данных DNS-пересылки.
- name: Validate local DNS server configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - ns_server_listen_port | int > 0
      - ns_server_listen_port | int < 65536
      - ns_server_forward_addresses is sequence
      - ns_server_forward_addresses | length > 0
    fail_msg: "ns_server supports Debian-family systems and requires a valid port and at least one upstream resolver."

# Install the Unbound DNS server package.
# Установка пакета DNS-сервера Unbound.
- name: Install Unbound DNS server
  ansible.builtin.apt:
    name: "unbound"
    state: present
    update_cache: true
  register: ns_server_package_result

# Write and validate the forwarding resolver configuration.
# Запись и проверка конфигурации резолвера с пересылкой.
- name: Configure Unbound DNS server
  ansible.builtin.template:
    src: "unbound.conf.j2"
    dest: "/etc/unbound/unbound.conf.d/ns-server.conf"
    mode: "0644"
    validate: "unbound-checkconf %s"
  notify: Restart Unbound DNS server
  register: ns_server_configuration_result

# Ensure the local DNS service is started and enabled.
# Обеспечение запуска и включения локального DNS-сервиса.
- name: Manage Unbound DNS service
  ansible.builtin.systemd:
    name: "unbound"
    state: started
    enabled: true
  register: ns_server_service_result

# Report DNS server changes without listing client queries.
# Вывод изменений DNS-сервера без перечисления клиентских запросов.
- name: Display DNS server change summary
  ansible.builtin.debug:
    msg: "Local DNS server {{ 'would change' if ansible_check_mode else 'changed' }}."
  when:
    - ns_server_debug_mode | bool
    - >-
      (ns_server_package_result.changed | default(false) | bool)
      or (ns_server_configuration_result.changed | default(false) | bool)
      or (ns_server_service_result.changed | default(false) | bool)
  tags:
    - debug
