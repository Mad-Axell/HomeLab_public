---
# Resolve the inventory record once so every later read is one hop
# Разрешение записи инвентаря один раз, чтобы каждое чтение ниже было в один шаг
- name: Resolve the VM inventory record
  ansible.builtin.set_fact:
    proxmox_vm_target: "{{ hostvars[proxmox_vm_target_host] }}"
  no_log: true

# Compute resources live in the target host vars first and fall back to the
# role variables given on the Proxmox node
# Вычислительные ресурсы сначала берутся из host_vars целевого хоста с фолбэком
# на переменные роли, заданные на ноде Proxmox
- name: Compute the effective VM settings
  ansible.builtin.set_fact:
    proxmox_vm_settings:
      cores: "{{ proxmox_vm_target.proxmox_vm_cores | default(proxmox_vm_cores) }}"
      sockets: "{{ proxmox_vm_target.proxmox_vm_sockets | default(proxmox_vm_sockets) }}"
      memory: "{{ proxmox_vm_target.proxmox_vm_memory | default(proxmox_vm_memory) }}"
      balloon: "{{ proxmox_vm_target.proxmox_vm_balloon | default(proxmox_vm_balloon) }}"
      disk_size: "{{ proxmox_vm_target.proxmox_vm_disk_size | default(proxmox_vm_disk_size) }}"
      disk_storage: "{{ proxmox_vm_target.proxmox_vm_disk_storage | default(proxmox_vm_disk_storage) }}"
      image_url: "{{ proxmox_vm_target.proxmox_vm_image_url | default(proxmox_vm_image_url) }}"
      image_dir: "{{ proxmox_vm_target.proxmox_vm_image_dir | default(proxmox_vm_image_dir) }}"
      bios: "{{ proxmox_vm_target.proxmox_vm_bios | default(proxmox_vm_bios) }}"
      machine: "{{ proxmox_vm_target.proxmox_vm_machine | default(proxmox_vm_machine) }}"
      scsihw: "{{ proxmox_vm_target.proxmox_vm_scsihw | default(proxmox_vm_scsihw) }}"
      ostype: "{{ proxmox_vm_target.proxmox_vm_ostype | default(proxmox_vm_ostype) }}"
      efidisk: "{{ proxmox_vm_target.proxmox_vm_efidisk | default(proxmox_vm_efidisk) }}"
      serial_socket: "{{ proxmox_vm_target.proxmox_vm_serial_socket | default(proxmox_vm_serial_socket) }}"
      agent_enabled: "{{ proxmox_vm_target.proxmox_vm_agent_enabled | default(proxmox_vm_agent_enabled) }}"
      onboot: "{{ proxmox_vm_target.proxmox_vm_onboot | default(proxmox_vm_onboot) }}"
      start: "{{ proxmox_vm_target.proxmox_vm_start | default(proxmox_vm_start) }}"
      description: "{{ proxmox_vm_target.proxmox_vm_description | default(proxmox_vm_description) }}"
      debug_mode: "{{ proxmox_vm_target.proxmox_vm_debug_mode | default(proxmox_vm_debug_mode) }}"

# Validate the contract before anything changes: the target must name a VM
# record on this node, carry an image URL and resolve to a network profile
# Проверка контракта до любых изменений: цель должна называть запись VM на этой
# ноде, нести URL образа и разрешаться в сетевой профиль
- name: Validate Proxmox VM inventory data
  ansible.builtin.assert:
    that:
      - proxmox_vm_target_host is string
      - proxmox_vm_target_host | length > 0
      - proxmox_vm_target_host in hostvars
      - proxmox_vm_settings.image_url is string
      - proxmox_vm_settings.image_url | length > 0
      - proxmox_vm_target.proxmox.type == 'vm'
      - proxmox_vm_target.proxmox.node == inventory_hostname
      - proxmox_vm_target.proxmox.vmid | int > 0
      - proxmox_vm_target.ansible_host is defined
      - proxmox_vm_target.network.bridge is defined
      - proxmox_vm_target.network.mac is defined
      - >-
        proxmox_vm_target.network.vlan_tag is not defined
        or proxmox_vm_target.network.vlan_tag is none
        or proxmox_vm_target.network.vlan_tag | int > 0
    fail_msg: >-
      proxmox_vm_target_host must name an inventory host with
      proxmox.type 'vm' on this node, an image URL, a MAC and a bridge.
    quiet: true

# Name the files the image download produces; a .xz archive decompresses to
# the same name without the suffix
# Имена файлов, которые даёт загрузка образа; архив .xz распаковывается в то же
# имя без суффикса
- name: Compute the image paths
  ansible.builtin.set_fact:
    proxmox_vm_image_archive: >-
      {{ proxmox_vm_settings.image_dir }}/{{ proxmox_vm_settings.image_url | basename }}
    proxmox_vm_image_file: >-
      {{ proxmox_vm_settings.image_dir }}/{{ (proxmox_vm_settings.image_url | basename) | regex_replace('\.xz$', '') }}

# The directory is standard on every Proxmox node but cheap to guarantee
# Каталог стандартен на любой ноде Proxmox, но гарантировать его дёшево
- name: Create the image directory
  ansible.builtin.file:
    path: "{{ proxmox_vm_settings.image_dir }}"
    state: directory
    mode: "0755"

# The decompressed file is the marker: an existing .qcow2 means the download
# and the unpack already happened
# Распакованный файл является маркером: существующий .qcow2 означает, что
# загрузка и распаковка уже произошли
- name: Check whether the disk image exists on the node
  ansible.builtin.stat:
    path: "{{ proxmox_vm_image_file }}"
  register: proxmox_vm_image_stat

- name: Download the VM disk image
  ansible.builtin.get_url:
    url: "{{ proxmox_vm_settings.image_url }}"
    dest: "{{ proxmox_vm_image_archive }}"
    mode: "0644"
  register: proxmox_vm_image_result
  when: not proxmox_vm_image_stat.stat.exists

# XZ archives decompress in place; `creates` keeps the run idempotent
# Архивы XZ распаковываются на месте; `creates` сохраняет идемпотентность
- name: Decompress the downloaded image
  ansible.builtin.command:
    cmd: "xz -df {{ proxmox_vm_image_archive }}"
    creates: "{{ proxmox_vm_image_file }}"
  register: proxmox_vm_decompress_result
  changed_when: proxmox_vm_decompress_result.rc == 0
  when:
    - proxmox_vm_image_archive != proxmox_vm_image_file
    - not proxmox_vm_image_stat.stat.exists

# `qm status` doubles as the existence probe: a missing VM exits non-zero
# `qm status` одновременно служит проверкой существования: отсутствующая VM
# завершается с ненулевым кодом
- name: Read the VM status
  ansible.builtin.command:
    cmd: "qm status {{ proxmox_vm_target.proxmox.vmid }}"
  register: proxmox_vm_status_result
  changed_when: false
  failed_when: false
  check_mode: false

# Assemble the create command once; the EFI disk, the serial socket, the VLAN
# tag and the description join conditionally
# Сборка команды создания один раз; EFI-диск, последовательный сокет, VLAN-тег
# и описание добавляются условно
- name: Compute the VM create command
  ansible.builtin.set_fact:
    proxmox_vm_create_cmd: "{{ _proxmox_vm_create_cmd }}"
  vars:
    _proxmox_vm_vlan: >-
      {{ ',tag=' ~ proxmox_vm_target.network.vlan_tag
         if proxmox_vm_target.network.vlan_tag is defined
         and proxmox_vm_target.network.vlan_tag is not none
         and proxmox_vm_target.network.vlan_tag | int > 0
         else '' }}
    _proxmox_vm_efidisk: >-
      {{ '--efidisk0 "' ~ proxmox_vm_settings.disk_storage
         ~ ':0,efitype=4m,pre-enrolled-keys=0"'
         if proxmox_vm_settings.efidisk | bool else '' }}
    _proxmox_vm_serial: >-
      {{ '--serial0 socket' if proxmox_vm_settings.serial_socket | bool else '' }}
    _proxmox_vm_notes: >-
      {{ '--description "'
         ~ (proxmox_vm_settings.description | replace('\n', ' ') | replace('"', "'"))
         ~ '"' if proxmox_vm_settings.description | length > 0 else '' }}
    _proxmox_vm_create_cmd: >-
      qm create {{ proxmox_vm_target.proxmox.vmid }}
      --name {{ proxmox_vm_target_host }}
      --memory {{ proxmox_vm_settings.memory }}
      --cores {{ proxmox_vm_settings.cores }}
      --sockets {{ proxmox_vm_settings.sockets }}
      --balloon {{ proxmox_vm_settings.balloon }}
      --ostype {{ proxmox_vm_settings.ostype }}
      --bios {{ proxmox_vm_settings.bios }}
      --machine {{ proxmox_vm_settings.machine }}
      --scsihw {{ proxmox_vm_settings.scsihw }}
      --agent enabled={{ 1 if proxmox_vm_settings.agent_enabled | bool else 0 }}
      --net0 "virtio={{ proxmox_vm_target.network.mac }},bridge={{ proxmox_vm_target.network.bridge }}{{ _proxmox_vm_vlan }}"
      {{ _proxmox_vm_efidisk }} {{ _proxmox_vm_serial }}
      --onboot {{ 1 if proxmox_vm_settings.onboot | bool else 0 }}
      {{ _proxmox_vm_notes }}
  when: proxmox_vm_status_result.rc != 0

# Create the VM shell without any disk; the image is imported next
# Создание оболочки VM без диска; образ импортируется следующим шагом
- name: Create the VM
  ansible.builtin.command:
    cmd: "{{ proxmox_vm_create_cmd }}"
  register: proxmox_vm_create_result
  changed_when: proxmox_vm_create_result.rc == 0
  when: proxmox_vm_status_result.rc != 0

# Import the image as an unused disk; the output carries the target volid
# Импорт образа как неиспользуемого диска; вывод несёт целевой volid
- name: Import the disk image
  ansible.builtin.command:
    cmd: >-
      qm importdisk {{ proxmox_vm_target.proxmox.vmid }}
      {{ proxmox_vm_image_file }} {{ proxmox_vm_settings.disk_storage }} --format qcow2
  register: proxmox_vm_import_result
  changed_when: proxmox_vm_import_result.rc == 0
  when: proxmox_vm_status_result.rc != 0

# Read the current config once; the imported volume id, the resize check and
# the parameter reconcile all derive from it. The config is also the reliable
# source for an interrupted run: a VM created but left with an unattached
# unused disk is detected here, not from importdisk wording
# Чтение текущей конфигурации один раз; id импортированного тома, проверка
# resize и сверка параметров выводятся из неё. Конфиг — также надёжный источник
# для прерванного прогона: VM, созданная с неподключённым unused-диском,
# обнаруживается здесь, а не по формулировкам importdisk
- name: Read the VM configuration
  ansible.builtin.command:
    cmd: "qm config {{ proxmox_vm_target.proxmox.vmid }}"
  register: proxmox_vm_config_result
  changed_when: false
  failed_when: false
  check_mode: false

# The unused disk line carries the imported volume as `unused0: <volid>`
# Строка unused-диска несёт импортированный том как `unused0: <volid>`
- name: Resolve the imported disk volume
  ansible.builtin.set_fact:
    proxmox_vm_disk_volid: >-
      {{ proxmox_vm_config_result.stdout | default('')
        | regex_findall('^unused\d+: (.+)$', multiline=true) | first | default('') }}
  when: proxmox_vm_status_result.rc == 0 or proxmox_vm_import_result is not skipped

# Attach when scsi0 is absent and an unused volume waits; on a fresh create
# this always fires, on a rerun it heals a VM whose first attach attempt
# failed
# Подключение, когда scsi0 отсутствует, а unused-том ожидает; при свежем
# создании срабатывает всегда, при повторе лечит VM, у которой первая попытка
# подключения упала
- name: Attach the imported disk as scsi0
  ansible.builtin.command:
    cmd: >-
      qm set {{ proxmox_vm_target.proxmox.vmid }}
      --scsi0 {{ proxmox_vm_disk_volid }},discard=on,iothread=1,ssd=1
      --boot order=scsi0
  register: proxmox_vm_attach_result
  changed_when: proxmox_vm_attach_result.rc == 0
  when:
    - "'scsi0:' not in proxmox_vm_config_result.stdout"
    - proxmox_vm_disk_volid | default('') | length > 0

# Re-read the config so the resize check sees the freshly attached disk
# Повторное чтение конфигурации, чтобы проверка resize видела только что
# подключённый диск
- name: Read the VM configuration after attach
  ansible.builtin.command:
    cmd: "qm config {{ proxmox_vm_target.proxmox.vmid }}"
  register: proxmox_vm_config_result
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - proxmox_vm_attach_result is defined
    - proxmox_vm_attach_result.changed | default(false) | bool

# Grow the disk only when the imported image is smaller than requested; qcow2
# imports keep their virtual size, so a second run sees size already reached.
# A missing size marker means the disk is not attached yet and must not grow
# Увеличение диска только когда импортированный образ меньше запрошенного;
# qcow2-импорт сохраняет виртуальный размер, поэтому повторный прогон видит,
# что размер уже достигнут. Отсутствие метки размера означает, что диск ещё не
# подключён и расти не должен
- name: Grow the scsi0 disk to the requested size
  ansible.builtin.command:
    cmd: >-
      qm resize {{ proxmox_vm_target.proxmox.vmid }} scsi0
      {{ proxmox_vm_settings.disk_size }}
  register: proxmox_vm_resize_result
  changed_when: proxmox_vm_resize_result.rc == 0
  when:
    - >-
      (proxmox_vm_config_result.stdout
       | regex_findall('^scsi0: .*size=([0-9]+)G', multiline=true) | first | default(0) | int)
      > 0
    - >-
      (proxmox_vm_config_result.stdout
       | regex_findall('^scsi0: .*size=([0-9]+)G', multiline=true) | first | default(0) | int)
      < (proxmox_vm_settings.disk_size | regex_replace('G$', '') | int)

# Build the `qm set` arguments for scalar parameters whose live value differs
# from the desired one; disk, NIC and firmware are creation-time choices and
# are not rewritten on reruns
# Формирование аргументов `qm set` для скалярных параметров, чьё текущее
# значение отличается от желаемого; диск, NIC и прошивка — решения момента
# создания и при повторах не перезаписываются
- name: Compute the differing scalar parameters
  ansible.builtin.set_fact:
    proxmox_vm_set_args: >-
      {% set cur = proxmox_vm_config_result.stdout | default('') | from_yaml %}
      {% set want = {
           'cores': proxmox_vm_settings.cores | string,
           'memory': proxmox_vm_settings.memory | string,
           'balloon': proxmox_vm_settings.balloon | string,
           'sockets': proxmox_vm_settings.sockets | string,
           'onboot': '1' if proxmox_vm_settings.onboot | bool else '0',
           'agent': 'enabled=1' if proxmox_vm_settings.agent_enabled | bool
                    else 'enabled=0'} %}
      {% set ns = namespace(args=[]) %}
      {% for k, v in want.items() %}
      {% if (cur[k] | default('') | string) != (v | string) %}
      {% set ns.args = ns.args + ['--' ~ k ~ ' ' ~ v] %}
      {% endif %}
      {% endfor %}
      {{ ns.args | join(' ') }}
  when: proxmox_vm_status_result.rc == 0

# Apply only when at least one scalar parameter drifted
# Применение только когда хотя бы один скалярный параметр разошёлся
- name: Apply the differing scalar parameters
  ansible.builtin.command:
    cmd: >-
      qm set {{ proxmox_vm_target.proxmox.vmid }}
      {{ proxmox_vm_set_args | trim }}
  register: proxmox_vm_set_result
  changed_when: proxmox_vm_set_result.rc == 0
  when:
    - proxmox_vm_status_result.rc == 0
    - proxmox_vm_set_args | default('') | trim | length > 0

# Start the VM when asked and it is not already running; the status probe
# words the running state as "status: running"
# Старт VM по запросу, если она ещё не запущена; проверка статуса выражает
# состояние работы как "status: running"
- name: Start the VM
  ansible.builtin.command:
    cmd: "qm start {{ proxmox_vm_target.proxmox.vmid }}"
  register: proxmox_vm_start_result
  changed_when: proxmox_vm_start_result.rc == 0
  when:
    - proxmox_vm_settings.start | bool
    - "'status: running' not in proxmox_vm_status_result.stdout"

# Report the outcome without echoing image URLs or command lines
# Вывод итога без повторения URL образов и командных строк
- name: Display Proxmox VM change summary
  ansible.builtin.debug:
    msg: >-
      VM {{ proxmox_vm_target.proxmox.vmid }} ({{ proxmox_vm_target_host }}):
      {{ 'WOULD CHANGE' if ansible_check_mode else 'CHANGED' }}
  when:
    - proxmox_vm_settings.debug_mode | bool
    - >-
      (proxmox_vm_image_result is defined
      and (proxmox_vm_image_result.changed | default(false) | bool))
      or (proxmox_vm_create_result is defined
      and (proxmox_vm_create_result.changed | default(false) | bool))
      or (proxmox_vm_import_result is defined
      and (proxmox_vm_import_result.changed | default(false) | bool))
      or (proxmox_vm_set_result is defined
      and (proxmox_vm_set_result.changed | default(false) | bool))
      or (proxmox_vm_start_result is defined
      and (proxmox_vm_start_result.changed | default(false) | bool))
  tags:
    - debug
