---
- name: Validate Zabbix agent configuration
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - zabbix_agent_server is not none
      - zabbix_agent_hostname is string
      - zabbix_agent_hostname | length > 0
      - zabbix_agent_listen_port | int > 0
      - not (zabbix_agent_register | bool) or zabbix_agent_api_url is not none
      - not (zabbix_agent_register | bool) or zabbix_agent_host_groups | length > 0
    fail_msg: >-
      zabbix_agent requires Debian, a server address and a hostname. Registration
      additionally requires an API URL and at least one host group.

- name: Validate the Zabbix API password
  ansible.builtin.assert:
    that:
      - zabbix_agent_api_password_var is not none
      - lookup('ansible.builtin.vars', zabbix_agent_api_password_var, default=none) is not none
    fail_msg: "zabbix_agent_api_password_var must name a variable defined in VARS/secrets.yml."
  when: zabbix_agent_register | bool
  no_log: true

# The vendor repository is removed rather than added: it has no amd64 packages for
# Debian 13, so it contributes only a third party in the trust path.
# Репозиторий вендора удаляется, а не добавляется: пакетов amd64 для Debian 13 у него нет,
# поэтому он даёт лишь третью сторону в цепочке доверия.
- name: Remove the vendor Zabbix repository packages
  ansible.builtin.apt:
    name: "{{ zabbix_agent_unwanted_packages }}"
    state: absent
    purge: true
  register: zabbix_agent_repository_result

- name: Remove the vendor Zabbix apt sources
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/etc/apt/sources.list.d/zabbix-release.sources"
    - "/etc/apt/sources.list.d/zabbix-tools.sources"
    - "/etc/apt/sources.list.d/zabbix-unstable.sources"

- name: Install the Zabbix agent
  ansible.builtin.apt:
    name: "{{ zabbix_agent_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: zabbix_agent_package_result

# Settings go into the drop-in directory the packaging already includes, so the shipped
# zabbix_agent2.conf stays untouched and keeps whatever the next package version changes.
# Настройки пишутся в каталог drop-in, который пакет уже подключает, поэтому поставляемый
# zabbix_agent2.conf остаётся нетронутым и сохраняет всё, что изменит следующая версия.
- name: Configure the Zabbix agent
  ansible.builtin.template:
    src: "agent.conf.j2"
    dest: "{{ zabbix_agent_config_path }}"
    owner: "root"
    group: "root"
    mode: "0644"
  notify: Restart Zabbix agent
  register: zabbix_agent_config_result

- name: Manage the Zabbix agent service
  ansible.builtin.systemd:
    name: "{{ zabbix_agent_service_name }}"
    state: "{{ zabbix_agent_service_state }}"
    enabled: "{{ zabbix_agent_service_enabled }}"
  register: zabbix_agent_service_result

- name: Apply pending Zabbix agent restarts
  ansible.builtin.meta: flush_handlers

# The address is frozen into a fact before the registration tasks run.
#
# Those tasks point the httpapi connection at the Zabbix server by overriding ansible_host in
# their own vars, and that override shadows ansible_host for everything else evaluated in the
# same scope - including the interface address, which would then be the Zabbix server's own
# IP for every host. The result registers cleanly and fails at poll time with "Received empty
# response from Zabbix Agent", naming the server's address while appearing to describe the
# agent. A fact is fixed when it is set and cannot be shadowed afterwards.
#
# Адрес фиксируется фактом до задач регистрации.
#
# Те задачи направляют соединение httpapi на сервер Zabbix, переопределяя ansible_host в
# собственных vars, и это переопределение затеняет ansible_host для всего, что вычисляется в
# той же области, - включая адрес интерфейса, который стал бы адресом самого сервера Zabbix
# для каждого хоста. Регистрация при этом проходит чисто и падает уже при опросе с "Received
# empty response from Zabbix Agent", называя адрес сервера так, будто описывает агента.
# Факт фиксируется в момент установки и затенён быть не может.
- name: Freeze the address the server will poll
  ansible.builtin.set_fact:
    zabbix_agent_resolved_interface_address: "{{ zabbix_agent_interface_address }}"
  when: zabbix_agent_register | bool

# Registration runs from the controller, not from the monitored host: the host has no reason
# to reach the Zabbix API, and giving every monitored machine API credentials would be the
# opposite of what monitoring is for.
# Регистрация выполняется с контроллера, а не с наблюдаемого хоста: хосту незачем ходить в
# API Zabbix, а раздача учётных данных API каждой наблюдаемой машине была бы прямо обратна
# смыслу мониторинга.
- name: Create the host groups on the Zabbix server
  community.zabbix.zabbix_group:
    host_groups: "{{ zabbix_agent_host_groups }}"
    state: present
  delegate_to: localhost
  become: false
  vars:
    ansible_zabbix_url_path: ""
    ansible_host: "{{ zabbix_agent_api_url | urlsplit('hostname') }}"
    ansible_connection: "httpapi"
    ansible_network_os: "community.zabbix.zabbix"
    ansible_httpapi_port: "{{ zabbix_agent_api_url | urlsplit('port') | default(80, true) }}"
    ansible_httpapi_use_ssl: "{{ (zabbix_agent_api_url | urlsplit('scheme')) == 'https' }}"
    ansible_httpapi_validate_certs: false
    ansible_user: "{{ zabbix_agent_api_user }}"
    ansible_httpapi_pass: "{{ lookup('ansible.builtin.vars', zabbix_agent_api_password_var) }}"
  when: zabbix_agent_register | bool
  register: zabbix_agent_group_result
  # Хосты идут параллельно, и все они создают одни и те же группы. Проигравший гонку
  # получает от API "Host group already exists" как ошибку, а не как признак того, что
  # цель уже достигнута. throttle убирает гонку внутри прогона, а failed_when - между
  # прогонами и между плейбуками, где throttle не помогает.
  #
  # Hosts run in parallel and all of them create the same groups. Whoever loses the race
  # gets "Host group already exists" from the API as an error rather than as a sign the
  # goal is already met. throttle removes the race inside one run; failed_when covers the
  # races between runs and between playbooks, where throttle cannot help.
  throttle: 1
  failed_when:
    - zabbix_agent_group_result is failed
    - "'already exists' not in (zabbix_agent_group_result.msg | default(''))"

- name: Register the host on the Zabbix server
  community.zabbix.zabbix_host:
    host_name: "{{ zabbix_agent_hostname }}"
    host_groups: "{{ zabbix_agent_host_groups }}"
    link_templates: "{{ zabbix_agent_templates }}"
    description: "{{ zabbix_agent_host_description }}"
    status: enabled
    state: present
    interfaces:
      - type: agent
        main: 1
        useip: 1
        ip: "{{ zabbix_agent_resolved_interface_address }}"
        dns: ""
        port: "{{ zabbix_agent_listen_port | string }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_zabbix_url_path: ""
    ansible_host: "{{ zabbix_agent_api_url | urlsplit('hostname') }}"
    ansible_connection: "httpapi"
    ansible_network_os: "community.zabbix.zabbix"
    ansible_httpapi_port: "{{ zabbix_agent_api_url | urlsplit('port') | default(80, true) }}"
    ansible_httpapi_use_ssl: "{{ (zabbix_agent_api_url | urlsplit('scheme')) == 'https' }}"
    ansible_httpapi_validate_certs: false
    ansible_user: "{{ zabbix_agent_api_user }}"
    ansible_httpapi_pass: "{{ lookup('ansible.builtin.vars', zabbix_agent_api_password_var) }}"
  when: zabbix_agent_register | bool
  register: zabbix_agent_host_result

- name: Display Zabbix agent change summary
  ansible.builtin.debug:
    msg: >-
      Zabbix agent on {{ zabbix_agent_hostname }}
      reporting to {{ zabbix_agent_server }};
      groups {{ zabbix_agent_host_groups | join(', ') }};
      templates {{ zabbix_agent_templates | join(', ') }}.
  when:
    - zabbix_agent_debug_mode | bool
    - >-
      (zabbix_agent_repository_result.changed | default(false) | bool)
      or (zabbix_agent_package_result.changed | default(false) | bool)
      or (zabbix_agent_config_result.changed | default(false) | bool)
      or (zabbix_agent_service_result.changed | default(false) | bool)
      or (zabbix_agent_host_result.changed | default(false) | bool)
  tags:
    - debug
