---
# UFW configuration
# Конфигурация UFW

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
configure_ufw_debug_mode: false

# String. Default incoming UFW policy.
# Строка. Политика UFW по умолчанию для входящего трафика.
configure_ufw_default_incoming_policy: "deny"

# String. Default outgoing UFW policy.
# Строка. Политика UFW по умолчанию для исходящего трафика.
configure_ufw_default_outgoing_policy: "allow"

# String. UFW logging level.
# Строка. Уровень журналирования UFW.
configure_ufw_logging: "low"

# List. Required UFW rules; each item needs rule, port, and proto, and may contain from_ip or comment.
# Список. Обязательные правила UFW; элементу нужны rule, port и proto, а from_ip и comment опциональны.
configure_ufw_rules: null
