---
# Validate the supported DNS host platform.
# Проверка поддерживаемой платформы DNS-хоста.
- name: Validate DNS host preparation
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - dns_stack_base_packages is sequence
    fail_msg: "dns_stack_base supports Debian-family systems and requires a package list."

# Install the packages required to operate the DNS stack.
# Установка пакетов, требуемых для работы DNS-стека.
- name: Install DNS host packages
  ansible.builtin.apt:
    name: "{{ dns_stack_base_packages }}"
    state: present
    update_cache: true
  register: dns_stack_base_package_result

# Stop systemd-resolved when a local DNS service must listen on port 53.
# Остановка systemd-resolved, когда локальный DNS-сервис должен слушать порт 53.
- name: Disable systemd-resolved
  ansible.builtin.systemd:
    name: "systemd-resolved"
    state: stopped
    enabled: false
    masked: true
  when: dns_stack_base_disable_systemd_resolved | bool
  register: dns_stack_base_resolved_result

# Report whether base DNS preparation changed the host.
# Вывод информации о том, изменила ли подготовка DNS хост.
- name: Display DNS host preparation summary
  ansible.builtin.debug:
    msg: "DNS host preparation {{ 'would change' if ansible_check_mode else 'changed' }}."
  when:
    - dns_stack_base_debug_mode | bool
    - >-
      (dns_stack_base_package_result.changed | default(false) | bool)
      or (dns_stack_base_resolved_result is defined and dns_stack_base_resolved_result.changed | default(false) | bool)
  tags:
    - debug
