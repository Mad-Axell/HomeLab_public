---
# DNS host preparation configuration
# Конфигурация подготовки DNS-хоста

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
dns_stack_base_debug_mode: false

# List. Base packages required by DNS-service roles.
# Список. Базовые пакеты, требуемые DNS-ролями сервисов.
dns_stack_base_packages:
  - "ca-certificates"
  - "curl"
  - "dnsutils"

# Boolean. Stop and disable systemd-resolved to free local DNS port 53.
# Логическое значение. Останавливает и отключает systemd-resolved для освобождения локального порта DNS 53.
dns_stack_base_disable_systemd_resolved: true
