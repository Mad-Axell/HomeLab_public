---
# AdGuard Home configuration
# Конфигурация AdGuard Home

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
dns_adguard_debug_mode: false

# String. AdGuard Home release archive URL.
# Строка. URL архива релиза AdGuard Home.
dns_adguard_archive_url: "https://static.adguard.com/adguardhome/release/AdGuardHome_linux_amd64.tar.gz"

# String. Installation directory for AdGuard Home.
# Строка. Каталог установки AdGuard Home.
dns_adguard_install_dir: "/opt/AdGuardHome"

# String. AdGuard Home systemd service name.
# Строка. Имя systemd-сервиса AdGuard Home.
dns_adguard_service_name: "AdGuardHome"

# String. Desired stable service state.
# Строка. Желаемое устойчивое состояние сервиса.
dns_adguard_service_state: "started"

# Boolean. Enable the service at boot.
# Логическое значение. Включает сервис при загрузке.
dns_adguard_service_enabled: true

# Integer. DNS listener port.
# Целое число. Порт DNS-слушателя.
dns_adguard_dns_port: 53

# Integer. Web administration listener port.
# Целое число. Порт веб-интерфейса администрирования.
dns_adguard_web_port: 3000

# String. AdGuard administrator user name.
# Строка. Имя пользователя-администратора AdGuard.
dns_adguard_admin_user: "admin"

# List. Upstream DNS server addresses.
# Список. Адреса вышестоящих DNS-серверов.
dns_adguard_upstream_dns:
  - "127.0.0.1:5335"
