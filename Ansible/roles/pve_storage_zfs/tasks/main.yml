---
- name: Validate PVE ZFS storage input
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - pve_storage_zfs_pools is sequence
      - pve_storage_zfs_pools | length > 0
      - pve_storage_zfs_datasets is sequence
      - pve_storage_zfs_paths is sequence
      - pve_storage_zfs_pools | selectattr('name', 'defined') | list | length == pve_storage_zfs_pools | length
      - pve_storage_zfs_pools | map(attribute='name') | list | unique | length == pve_storage_zfs_pools | length
      - pve_storage_zfs_pools | selectattr('topology', 'defined') | list | length == pve_storage_zfs_pools | length
      - pve_storage_zfs_pools | map(attribute='topology') | difference(['stripe', 'mirror', 'raidz', 'raidz2', 'raidz3']) | length == 0
      - pve_storage_zfs_pools | selectattr('devices', 'defined') | list | length == pve_storage_zfs_pools | length
    fail_msg: "pve_storage_zfs requires Debian and valid pool, dataset, and path lists."

- name: Install PVE ZFS storage packages
  ansible.builtin.apt:
    name: "{{ pve_storage_zfs_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: pve_storage_zfs_package_result

- name: Read existing ZFS pool names
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - list
      - -H
      - -o
      - name
  register: pve_storage_zfs_pool_list_before
  changed_when: false
  failed_when: pve_storage_zfs_pool_list_before.rc not in [0, 1]

- name: Resolve missing ZFS pools
  ansible.builtin.set_fact:
    pve_storage_zfs_existing_pool_names: >-
      {{ pve_storage_zfs_pool_list_before.stdout_lines | default([]) }}
    pve_storage_zfs_missing_pools: >-
      {{
        pve_storage_zfs_pools
        | rejectattr(
          'name',
          'in',
          pve_storage_zfs_pool_list_before.stdout_lines | default([])
        )
        | list
      }}

- name: Require explicit confirmation before creating ZFS pools
  ansible.builtin.assert:
    that:
      - pve_storage_zfs_apply | bool
      - pve_storage_zfs_apply_confirmation == pve_storage_zfs_required_confirmation
    fail_msg: >-
      One or more ZFS pools are absent. Re-run with pve_storage_zfs_apply=true
      and pve_storage_zfs_apply_confirmation={{ pve_storage_zfs_required_confirmation }}
      only after verifying every /dev/disk/by-id path.
  when: pve_storage_zfs_missing_pools | length > 0

- name: Validate declared ZFS pool topology
  ansible.builtin.assert:
    that:
      - item.devices is sequence
      - item.devices | length >= 2
      - item.topology != 'mirror' or item.devices | length == 2
      - item.topology not in ['raidz2'] or item.devices | length >= 4
      - item.topology not in ['raidz3'] or item.devices | length >= 5
    fail_msg: "ZFS pool {{ item.name }} has an invalid device count for {{ item.topology }}."
  loop: "{{ pve_storage_zfs_missing_pools }}"
  loop_control:
    label: "{{ item.name }}"

- name: Check stable device paths for missing ZFS pools
  ansible.builtin.stat:
    path: "{{ item.1 }}"
    follow: true
  loop: "{{ query('subelements', pve_storage_zfs_missing_pools, 'devices') }}"
  loop_control:
    label: "{{ item.0.name }}: {{ item.1 }}"
  register: pve_storage_zfs_device_stats

- name: Require every declared ZFS device to exist
  ansible.builtin.assert:
    that:
      - item.stat.exists
      - item.stat.isblk
    fail_msg: "Declared ZFS device {{ item.item.1 }} does not exist or is not a block device."
  loop: "{{ pve_storage_zfs_device_stats.results }}"
  loop_control:
    label: "{{ item.item.1 }}"

- name: Create missing ZFS pools
  ansible.builtin.command:
    argv: >-
      {{
        ['/usr/sbin/zpool', 'create']
        + (['-f'] if pve_storage_zfs_force_create | bool else [])
        + ['-o', 'ashift=' ~ (item.ashift | default(12) | string), item.name]
        + ([item.topology] if item.topology != 'stripe' else [])
        + item.devices
      }}
  loop: "{{ pve_storage_zfs_missing_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - pve_storage_zfs_apply | bool
    - not ansible_check_mode
  changed_when: true
  register: pve_storage_zfs_pool_create_result

- name: Refresh ZFS pool names
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - list
      - -H
      - -o
      - name
  register: pve_storage_zfs_pool_list_after
  changed_when: false
  failed_when: pve_storage_zfs_pool_list_after.rc not in [0, 1]

- name: Require declared ZFS pools after apply
  ansible.builtin.assert:
    that:
      - item.name in pve_storage_zfs_pool_list_after.stdout_lines | default([])
    fail_msg: "Declared ZFS pool {{ item.name }} is not available."
  loop: "{{ pve_storage_zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: not ansible_check_mode

# Read the actual vdev layout of every pool that already exists. This role creates only
# absent pools, so without this read a pool built with the wrong redundancy stays invisible
# to every later run: the pool is present and ONLINE, and the run converges green over it.
# Читает фактическую раскладку vdev каждого существующего пула. Роль создаёт только
# отсутствующие пулы, поэтому без этого чтения пул, собранный с неверной избыточностью,
# остаётся невидимым для всех последующих прогонов: пул есть, он ONLINE, прогон зелёный.
- name: Read the actual vdev layout of existing ZFS pools
  ansible.builtin.command:
    argv:
      - /usr/sbin/zpool
      - list
      - -vH
      - "{{ item.name }}"
  loop: "{{ pve_storage_zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when: item.name in pve_storage_zfs_pool_list_after.stdout_lines | default([])
  register: pve_storage_zfs_layout_result
  changed_when: false
  check_mode: false

# Compare the declared topology with the one ZFS reports. zpool list -vH indents top-level
# vdevs and their leaf devices with the same single tab, so the levels cannot be told apart
# by indentation; a redundancy group is recognised by its <type>-<index> name instead. A
# pool whose children carry no such name has no redundancy group at all, that is a stripe.
# Сравнивает объявленную топологию с той, что сообщает ZFS. zpool list -vH отступает
# vdev верхнего уровня и его диски одним и тем же табом, поэтому уровни по отступу не
# различаются; группа избыточности опознаётся по имени вида <тип>-<индекс>. Пул, у чьих
# потомков такого имени нет, не имеет группы избыточности вообще, то есть является stripe.
- name: Require the actual ZFS pool topology to match the declaration
  ansible.builtin.assert:
    that:
      - pve_storage_zfs_actual_topology == pve_storage_zfs_expected_topology
      - pve_storage_zfs_group_vdevs | length <= 1
    fail_msg: >-
      ZFS pool {{ item.item.name }} is {{ pve_storage_zfs_actual_topology }} on disk while
      the inventory declares {{ item.item.topology }}. ZFS cannot convert a pool between
      topologies in place, and adding a vdev to "repair" it only widens the stripe. Copy
      the data to a verified independent target, destroy the pool, then let this role
      create it again from the declaration.
  vars:
    # Children of the pool: field 1 of every tab-indented line.
    # Потомки пула: поле 1 каждой строки с табом в начале.
    pve_storage_zfs_child_names: >-
      {{
        item.stdout_lines | default([])
        | select('match', '\t')
        | map('regex_replace', '^\t([^\t]+)\t.*$', '\1')
        | list
      }}
    pve_storage_zfs_group_vdevs: >-
      {{
        pve_storage_zfs_child_names
        | select('match', '^(mirror|raidz[1-3]?|draid[1-3]?)-[0-9]+$')
        | list
      }}
    pve_storage_zfs_actual_topology: >-
      {{
        'stripe' if pve_storage_zfs_group_vdevs | length == 0
        else pve_storage_zfs_group_vdevs[0] | regex_replace('-[0-9]+$', '')
      }}
    # zpool reports single-parity raidz as raidz1; the declaration spells it raidz.
    # zpool сообщает об одинарной чётности как raidz1; в объявлении она пишется raidz.
    pve_storage_zfs_expected_topology: >-
      {{ 'raidz1' if item.item.topology == 'raidz' else item.item.topology }}
  loop: "{{ pve_storage_zfs_layout_result.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name }}"
  when: not (item.skipped | default(false))

- name: Configure ZFS datasets and properties
  community.general.zfs:
    name: "{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.properties | default({}) }}"
  loop: "{{ pve_storage_zfs_datasets }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - pve_storage_zfs_apply | bool
    - item.name.split('/')[0] in pve_storage_zfs_pool_list_after.stdout_lines | default([])
  register: pve_storage_zfs_dataset_result

- name: Configure ZFS dataset ownership and permissions
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop: "{{ pve_storage_zfs_paths }}"
  loop_control:
    label: "{{ item.path }}"
  when: pve_storage_zfs_apply | bool
  register: pve_storage_zfs_path_result

- name: Manage the ZFS event daemon
  ansible.builtin.systemd_service:
    name: zfs-zed.service
    state: started
    enabled: "{{ pve_storage_zfs_zed_enabled }}"
  when: pve_storage_zfs_apply | bool
  register: pve_storage_zfs_zed_result

- name: Gather ZFS pool health facts
  community.general.zpool_facts:
    properties: health,size,free

- name: Require every declared ZFS pool to be online
  ansible.builtin.assert:
    that:
      - >-
        ansible_zfs_pools
        | selectattr('name', 'equalto', item.name)
        | map(attribute='health')
        | first
        == 'ONLINE'
    fail_msg: "ZFS pool {{ item.name }} is not ONLINE."
  loop: "{{ pve_storage_zfs_pools }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - not ansible_check_mode
    - item.name in pve_storage_zfs_pool_list_after.stdout_lines | default([])

- name: Display PVE ZFS storage summary
  ansible.builtin.debug:
    msg: >-
      ZFS storage validation completed; missing pools before apply:
      {{ pve_storage_zfs_missing_pools | map(attribute='name') | list }}.
  when: pve_storage_zfs_debug_mode | bool
  tags:
    - debug
