---
# Restart the daemon after a configuration, token or unit change; daemon_reload
# covers the unit file change in the same pass. Skipped when the operator keeps
# the service stopped on purpose.
# Перезапуск демона после изменения конфигурации, токена или юнита; daemon_reload
# покрывает изменение файла юнита тем же вызовом. Пропускается, когда оператор
# намеренно держит сервис остановленным.
- name: Restart yandex-disk
  ansible.builtin.systemd_service:
    name: "{{ yandex_disk_service_name }}"
    state: "restarted"
    daemon_reload: true
  when: yandex_disk_service_state == 'started'
