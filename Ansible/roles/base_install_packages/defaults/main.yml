---
# Package management configuration
# Конфигурация управления пакетами

# Boolean. Enable change notifications in debug output.
# Логическое значение. Включает уведомления об изменениях в debug-выводе.
install_packages_debug_mode: false

# List. Required package names to manage.
# Список. Обязательные имена пакетов для управления.
install_packages_names: null

# String. Requested package state.
# Строка. Запрошенное состояние пакетов.
install_packages_state: "present"
