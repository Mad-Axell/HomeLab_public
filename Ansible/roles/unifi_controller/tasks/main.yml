---
# Validate the Debian platform and the explicit repository contract before any change
# Проверка платформы Debian и явного контракта репозиториев до любого изменения
- name: Assert required UniFi controller variables are defined
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == 'Debian'
      - unifi_controller_repository is string
      - (unifi_controller_repository | trim | length) > 0
      - unifi_controller_repository_key_url is string
      - (unifi_controller_repository_key_url | trim | length) > 0
      - unifi_controller_mongodb_repository is string
      - (unifi_controller_mongodb_repository | trim | length) > 0
      - unifi_controller_mongodb_repository_key_url is string
      - (unifi_controller_mongodb_repository_key_url | trim | length) > 0
    fail_msg: >-
      unifi_controller requires Debian and explicit UniFi and MongoDB
      repository and signing-key values
    quiet: true

# Read the CPU flag list, which Ansible does not expose as a fact
# Чтение списка флагов CPU, который Ansible не предоставляет отдельным фактом
- name: Read the CPU flags exposed to the host
  ansible.builtin.slurp:
    src: "/proc/cpuinfo"
  register: unifi_controller_cpuinfo_result
  when: unifi_controller_require_avx | bool

# Refuse to install MongoDB 5.0 or newer on a CPU without AVX, where mongod aborts on start
# Отказ от установки MongoDB 5.0 и новее на CPU без AVX, где mongod падает при старте
- name: Assert the CPU exposes the AVX flag required by MongoDB
  ansible.builtin.assert:
    that:
      # Backslashes are doubled because Jinja parses the string literal first
      # and would otherwise turn \b into a backspace character.
      - >-
        unifi_controller_cpuinfo_result.content | b64decode
        is search('(?m)^flags\\s*:.*\\bavx\\b')
    fail_msg: >-
      MongoDB 5.0 and newer require the AVX CPU flag; set
      unifi_controller_require_avx to false only together with a MongoDB 4.4 stack
    quiet: true
  when: unifi_controller_require_avx | bool

# Install the packages needed to fetch and verify the signed repositories
# Установка пакетов, необходимых для получения и проверки подписанных репозиториев
- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
      - "ca-certificates"
      - "curl"
      - "gnupg"
    state: present
    update_cache: true
  register: unifi_controller_prerequisite_result

# Create the APT keyring directory shared by both repositories
# Создание общего каталога APT keyring для обоих репозиториев
- name: Create the APT keyring directory
  ansible.builtin.file:
    path: "{{ unifi_controller_keyring_directory }}"
    state: directory
    mode: "0755"
  register: unifi_controller_keyring_directory_result

# Download the ASCII-armored MongoDB signing key without using apt-key
# Загрузка ASCII-armored ключа подписи MongoDB без использования apt-key
- name: Download the MongoDB repository signing key
  ansible.builtin.get_url:
    url: "{{ unifi_controller_mongodb_repository_key_url }}"
    dest: "{{ unifi_controller_keyring_directory }}/{{ unifi_controller_mongodb_keyring_file }}"
    mode: "0644"
  register: unifi_controller_mongodb_key_result

# Register the MongoDB repository that actually ships the server packages
# Регистрация репозитория MongoDB, который реально содержит серверные пакеты
- name: Configure the MongoDB APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ unifi_controller_keyring_directory }}/{{ unifi_controller_mongodb_keyring_file }}]
      {{ unifi_controller_mongodb_repository }}
    filename: "mongodb-org"
    state: present
  register: unifi_controller_mongodb_repository_result

# Download the binary UniFi signing key without using apt-key
# Загрузка бинарного ключа подписи UniFi без использования apt-key
- name: Download the UniFi repository signing key
  ansible.builtin.get_url:
    url: "{{ unifi_controller_repository_key_url }}"
    dest: "{{ unifi_controller_keyring_directory }}/{{ unifi_controller_keyring_file }}"
    mode: "0644"
  register: unifi_controller_key_result

# Register the pinned UniFi repository suite
# Регистрация закреплённого suite репозитория UniFi
- name: Configure the UniFi APT repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ unifi_controller_keyring_directory }}/{{ unifi_controller_keyring_file }}]
      {{ unifi_controller_repository }}
    filename: "unifi-controller"
    state: present
  register: unifi_controller_repository_result

# Install the Java runtime and the MongoDB server that the UniFi package depends on
# Установка среды Java и сервера MongoDB, от которых зависит пакет UniFi
- name: Install the Java runtime and MongoDB server
  ansible.builtin.apt:
    name:
      - "{{ unifi_controller_java_package }}"
      - "{{ unifi_controller_mongodb_package }}"
    state: present
    update_cache: true
  register: unifi_controller_dependency_result

# Keep the packaged MongoDB unit in its steady state; UniFi supervises its own
# mongod on a private port and dbpath, so the packaged unit is stopped by default
# Поддержание устойчивого состояния пакетного юнита MongoDB; UniFi сам управляет
# своим mongod на отдельном порту и dbpath, поэтому пакетный юнит по умолчанию остановлен
- name: Manage the packaged MongoDB service
  ansible.builtin.systemd_service:
    name: "{{ unifi_controller_mongodb_service_name }}"
    state: "{{ unifi_controller_mongodb_service_state }}"
    enabled: "{{ unifi_controller_mongodb_service_enabled }}"
  register: unifi_controller_mongodb_service_result

# Read the unit state; systemd keeps a failure recorded even after the unit is stopped
# Чтение состояния юнита; systemd сохраняет запись об отказе даже после остановки
- name: Check whether the packaged MongoDB unit is in a failed state
  ansible.builtin.command:
    cmd: "systemctl is-failed {{ unifi_controller_mongodb_service_name }}"
  register: unifi_controller_mongodb_failed_result
  changed_when: false
  failed_when: false
  check_mode: false
  when: unifi_controller_mongodb_service_state == 'stopped'

# Clear the stale failure so an intentionally unused unit stays out of systemctl --failed
# Сброс устаревшего отказа, чтобы намеренно неиспользуемый юнит не висел в systemctl --failed
- name: Clear the stale packaged MongoDB failure
  ansible.builtin.command:
    cmd: "systemctl reset-failed {{ unifi_controller_mongodb_service_name }}"
  register: unifi_controller_mongodb_reset_result
  changed_when: true
  when:
    - unifi_controller_mongodb_service_state == 'stopped'
    - >-
      (unifi_controller_mongodb_failed_result.stdout | default('') | trim)
      == 'failed'

# Install UniFi without recommends so the Debian mongodb packages are not pulled in
# Установка UniFi без recommends, чтобы не подтянуть debian-пакеты mongodb
- name: Install UniFi Network Server
  ansible.builtin.apt:
    name: "{{ unifi_controller_package_name }}"
    state: present
    install_recommends: false
    update_cache: true
  register: unifi_controller_package_result

# Keep the UniFi service in its steady state
# Поддержание устойчивого состояния сервиса UniFi
- name: Manage the UniFi service
  ansible.builtin.systemd_service:
    name: "{{ unifi_controller_service_name }}"
    state: "{{ unifi_controller_service_state }}"
    enabled: "{{ unifi_controller_service_enabled }}"
  register: unifi_controller_service_result

# Report the installation outcome without repeating package manager output
# Вывод итога установки без повторения вывода пакетного менеджера
- name: Display UniFi controller change summary
  ansible.builtin.debug:
    msg: >-
      UniFi Network Server stack:
      {{ 'WOULD CHANGE' if ansible_check_mode else 'CHANGED' }}
  when:
    - unifi_controller_debug_mode | bool
    - >-
      (unifi_controller_prerequisite_result is defined
      and (unifi_controller_prerequisite_result.changed | default(false) | bool))
      or (unifi_controller_keyring_directory_result is defined
      and (unifi_controller_keyring_directory_result.changed | default(false) | bool))
      or (unifi_controller_mongodb_key_result is defined
      and (unifi_controller_mongodb_key_result.changed | default(false) | bool))
      or (unifi_controller_mongodb_repository_result is defined
      and (unifi_controller_mongodb_repository_result.changed | default(false) | bool))
      or (unifi_controller_key_result is defined
      and (unifi_controller_key_result.changed | default(false) | bool))
      or (unifi_controller_repository_result is defined
      and (unifi_controller_repository_result.changed | default(false) | bool))
      or (unifi_controller_dependency_result is defined
      and (unifi_controller_dependency_result.changed | default(false) | bool))
      or (unifi_controller_mongodb_service_result is defined
      and (unifi_controller_mongodb_service_result.changed | default(false) | bool))
      or (unifi_controller_package_result is defined
      and (unifi_controller_package_result.changed | default(false) | bool))
      or (unifi_controller_service_result is defined
      and (unifi_controller_service_result.changed | default(false) | bool))
  tags:
    - debug
